const compile = (gl, type, source) => {
  const shader = gl.createShader(type);
  if (!shader) return null;
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (gl.getShaderParameter(shader, gl.COMPILE_STATUS)) return shader;
  gl.deleteShader(shader);
  return null;
};

const link = (gl, vertexSource, fragmentSource, names) => {
  const vertex = compile(gl, gl.VERTEX_SHADER, vertexSource);
  const fragment = compile(gl, gl.FRAGMENT_SHADER, fragmentSource);
  const program = gl.createProgram();
  if (!vertex || !fragment || !program) return null;
  gl.attachShader(program, vertex);
  gl.attachShader(program, fragment);
  gl.linkProgram(program);
  gl.deleteShader(vertex);
  gl.deleteShader(fragment);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    gl.deleteProgram(program);
    return null;
  }
  const uniforms = {};
  names.forEach(name => {
    uniforms[name] = gl.getUniformLocation(program, name);
  });
  return { program, uniforms };
};

    'uRadii',
    'uSpine',
    'uLens',
    'uMorph',
    'uInsideTop',
    'uInsideBottom',
    'uTabRatio',
    'uGutter',
    'uBevel',
    'uStrength',
    'uSplit',
    'uTint',
    'uHaze',
    'uDim',
    'uGlint',
    'uShine',

  const targets = [makeTarget(), makeTarget(), makeTarget()];
  const size = { width: 0, height: 0 };
  const textures = new Map();

  const placed = (program, scene) => {
    gl.uniform1f(program.uniforms.uDepth, scene.depth);
    gl.uniform2f(program.uniforms.uOrigin, scene.origin[0], scene.origin[1]);

    if (canvas.width !== width) canvas.width = width;
    if (canvas.height !== height) canvas.height = height;
    if (size.width === width && size.height === height) return;
    size.width = width;
    size.height = height;

      gl.bindTexture(gl.TEXTURE_2D, target.texture);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, width, height, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

    gl.bindFramebuffer(gl.FRAMEBUFFER, target.frame);
    gl.clear(gl.COLOR_BUFFER_BIT);

    gl.uniform2f(blur.uniforms.uStep, stepX, stepY);

    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    upload(key, source) {
      let texture = textures.get(key);
      if (!texture) {

        textures.set(key, texture);

      gl.bindTexture(gl.TEXTURE_2D, texture);
      gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    },
    prune(keys) {
      textures.forEach((texture, key) => {
        if (keys.has(key)) return;
        gl.deleteTexture(texture);
        textures.delete(key);
      });
    },
    render(scene) {
      if (gl.isContextLost()) return;
      const width = Math.max(1, Math.round(scene.view.width * scene.dpr));
      const height = Math.max(1, Math.round(scene.view.height * scene.dpr));
      resize(width, height);
      const [sharp, half, soft] = targets;
      gl.bindVertexArray(vao);
      gl.activeTexture(gl.TEXTURE0);
      gl.viewport(0, 0, width, height);
      gl.clearColor(0, 0, 0, 0);

      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      gl.bindFramebuffer(gl.FRAMEBUFFER, sharp.frame);

      gl.uniform1f(paint.uniforms.uBleed, 0);
      scene.layers.forEach(layer => {
        const texture = textures.get(layer.key);
        if (!texture) return;
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.uniformMatrix4fv(paint.uniforms.uModel, false, layer.matrix);
        gl.uniform2f(paint.uniforms.uSize, layer.width, layer.height);
        gl.uniform1f(paint.uniforms.uAlpha, layer.alpha);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      });

      const pane = scene.glass;
      const sigma = pane.frost * scene.dpr;
      let behind = sharp;
      if (sigma > 0.35) {
        gl.disable(gl.BLEND);
        gl.useProgram(blur.program);
        gl.uniform1i(blur.uniforms.uImage, 0);
        pass(sharp, half, 1 / width, 0, sigma);
        pass(half, soft, 0, 1 / height, sigma);
        gl.enable(gl.BLEND);
        behind = soft;
      }

      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.clear(gl.COLOR_BUFFER_BIT);
      const u = glass.uniforms;
      gl.useProgram(glass.program);
      placed(glass, scene);
      gl.bindTexture(gl.TEXTURE_2D, behind.texture);
      gl.uniform1i(u.uBehind, 0);
      gl.uniformMatrix4fv(u.uModel, false, pane.matrix);
      gl.uniform2f(u.uSize, pane.width, pane.height);
      gl.uniform1f(u.uBleed, pane.bleed);
      gl.uniform4fv(u.uRadii, pane.radii);
      gl.uniform1f(u.uSpine, pane.spine);
      gl.uniform1f(u.uLens, pane.lens);
      gl.uniform1f(u.uMorph, pane.morph);
      gl.uniform3fv(u.uInsideTop, pane.insideTop);
      gl.uniform3fv(u.uInsideBottom, pane.insideBottom);
      gl.uniform1f(u.uTabRatio, pane.tabRatio);
      gl.uniform2fv(u.uGutter, pane.gutter);
      gl.uniform1f(u.uBevel, pane.bevel);
      gl.uniform1f(u.uStrength, pane.strength);
      gl.uniform1f(u.uSplit, pane.split);
      gl.uniform4fv(u.uTint, pane.tint);
      gl.uniform1f(u.uHaze, pane.haze);
      gl.uniform1f(u.uDim, pane.dim);
      gl.uniform1f(u.uGlint, pane.glint);
      gl.uniform1f(u.uShine, pane.shine);
      gl.uniform2fv(u.uLight, pane.light);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    },
    dispose() {
      textures.forEach(texture => gl.deleteTexture(texture));
      textures.clear();
      targets.forEach(target => {
        gl.deleteTexture(target.texture);
        gl.deleteFramebuffer(target.frame);
      });
      gl.deleteBuffer(buffer);
      gl.deleteVertexArray(vao);
      gl.deleteProgram(paint.program);
      gl.deleteProgram(blur.program);
      gl.deleteProgram(glass.program);
    }
  };
};

const roundedRect = (ctx, x, y, width, height, radius) => {
  const r = Math.max(0, Math.min(radius, width / 2, height / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + width, y, x + width, y + height, r);
  ctx.arcTo(x + width, y + height, x, y + height, r);
  ctx.arcTo(x, y + height, x, y, r);
  ctx.arcTo(x, y, x + width, y, r);
  ctx.closePath();
};

const offsetWithin = (element, root) => {
  let x = 0;
  let y = 0;
  let node = element;
  while (node && node !== root) {
    x += node.offsetLeft;
    y += node.offsetTop;
    node = node.offsetParent;
  }
  return node === root ? [x, y] : null;
};

const isClear = color => !color || color === 'transparent' || /rgba?\([^)]*[,/]\s*0\s*\)$/.test(color);

const drawText = (ctx, element, x, y, width, style) => {
  const text = Array.from(element.childNodes)
    .filter(node => node.nodeType === 3)
    .map(node => node.textContent)
    .join('')
    .trim();
  if (!text) return;
  const size = parseFloat(style.fontSize) || 12;
  const lineHeight = parseFloat(style.lineHeight) || size * 1.2;
  const left = x + (parseFloat(style.paddingLeft) || 0);
  const top = y + (parseFloat(style.paddingTop) || 0);
  const room = width - (parseFloat(style.paddingLeft) || 0) - (parseFloat(style.paddingRight) || 0);
  ctx.font = `${style.fontStyle} ${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
  ctx.fillStyle = style.color;
  ctx.textBaseline = 'middle';
  const fit = line => {
    if (ctx.measureText(line).width <= room) return line;
    let cut = line;
    while (cut.length > 1 && ctx.measureText(`${cut}…`).width > room) cut = cut.slice(0, -1);
    return `${cut.trimEnd()}…`;
  };
  if (style.whiteSpace === 'nowrap') {
    ctx.fillText(fit(text), left, top + lineHeight / 2);
    return;
  }
  let line = '';
  let row = 0;
  text.split(/\s+/).forEach(word => {
    const next = line ? `${line} ${word}` : word;
    if (line && ctx.measureText(next).width > room) {
      ctx.fillText(line, left, top + lineHeight * (row + 0.5));
      row += 1;
      line = word;
    } else {
      line = next;
    }
  });
  if (line) ctx.fillText(line, left, top + lineHeight * (row + 0.5));
};

const rasterize = (node, dpr, skipImages) => {
  const width = Math.max(1, node.offsetWidth);
  const height = Math.max(1, node.offsetHeight);
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(width * dpr));
  canvas.height = Math.max(1, Math.round(height * dpr));
  const pending = [];
  const ctx = canvas.getContext('2d');
  if (!ctx) return { canvas, pending };
  ctx.scale(dpr, dpr);
  const paint = (element, x, y) => {
    const style = getComputedStyle(element);
    if (style.display === 'none' || style.visibility === 'hidden') return;
    const w = element.offsetWidth;
    const h = element.offsetHeight;
    const radius = parseFloat(style.borderTopLeftRadius) || 0;
    const opacity = element !== node && Number.isFinite(parseFloat(style.opacity)) ? parseFloat(style.opacity) : 1;
    ctx.save();
    ctx.globalAlpha *= opacity;
    if (!isClear(style.backgroundColor)) {
      ctx.fillStyle = style.backgroundColor;
      roundedRect(ctx, x, y, w, h, radius);
      ctx.fill();
    }
    if (style.overflow !== 'visible') {
      roundedRect(ctx, x, y, w, h, radius);
      ctx.clip();
    }
    if (element instanceof HTMLImageElement) {
      if (!element.complete || !element.naturalWidth) pending.push(element);
      else if (!skipImages) {
        const ratio = Math.max(w / element.naturalWidth, h / element.naturalHeight);
        const sw = w / ratio;
        const sh = h / ratio;
        ctx.drawImage(element, (element.naturalWidth - sw) / 2, (element.naturalHeight - sh) / 2, sw, sh, x, y, w, h);
      }
    } else {
      drawText(ctx, element, x, y, w, style);
      Array.from(element.children).forEach(child => {
        const at = offsetWithin(child, node);
        if (at) paint(child, at[0], at[1]);
      });
    }
    ctx.restore();
  };
  paint(node, 0, 0);
  return { canvas, pending };
};

const paintBack = (g, top, bottom, dpr) => {
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(g.w * dpr));
  canvas.height = Math.max(1, Math.round((g.tabH + g.h) * dpr));
  const ctx = canvas.getContext('2d');
  if (!ctx) return canvas;
  ctx.scale(dpr, dpr);
  const fill = ctx.createLinearGradient(0, 0, 0, g.tabH + g.h);
  fill.addColorStop(0, top);
  fill.addColorStop(1, bottom);
  ctx.fillStyle = fill;
  ctx.fill(new Path2D(backPath(g)));
  return canvas;
};

const DocumentCard = ({ title, description }) => (
  <div className="folder-doc">
    {title ? <span className="folder-doc-title">{title}</span> : <span className="folder-doc-heading" />}
    {description && <span className="folder-doc-text">{description}</span>}
    <span className="folder-doc-line" style={{ width: '92%' }} />
    <span className="folder-doc-line" style={{ width: '84%' }} />
    <span className="folder-doc-line" style={{ width: '88%' }} />
    <span className="folder-doc-block" />
    <span className="folder-doc-line" style={{ width: '80%' }} />
    <span className="folder-doc-line" style={{ width: '62%' }} />
  </div>
);

const renderItem = item => {
  if (isValidElement(item)) return item;
  if (typeof item === 'string' || typeof item === 'number') return <DocumentCard title={String(item)} />;
  if (item && typeof item === 'object') {
    if (item.image) {
      return (
        <div className="folder-photo">
          <img src={item.image} alt={item.alt ?? item.title ?? ''} draggable={false} />
        </div>
      );
    }
    if (item.content) return item.content;
    return <DocumentCard title={item.title} description={item.description} />;
  }
  return <DocumentCard />;
};

const placeBook = (rank, count, phase, layout, g) => {
  const pileX = g.w / 2;
  const pileY = g.frontTop + g.frontH / 2;
  if (phase === 'open') {
    if (layout === 'row') {
      const gap = 10 * g.scale;
      const fit = Math.min(0.8, (g.w * 1.86 - gap * (count - 1)) / (count * g.docW));
      const step = g.docW * fit + gap;
      return { x: g.w / 2 + (rank - (count - 1) / 2) * step, y: pileY, z: 0, r: 0, ry: 0, s: fit };
    }
    if (layout === 'stack') {
      const fit = 0.74;
      const strip = Math.min(26 * g.scale, (g.h * 0.36) / Math.max(1, count - 1));
      const top = g.frontTop + 14 * g.scale + (count - 1) * strip;
      return { x: g.w, y: top + (g.docH * fit) / 2 - rank * strip, z: 0, r: 0, ry: 0, s: fit };
    }
    const fit = count > 4 ? 0.58 : count > 3 ? 0.64 : 0.72;
    const span = count === 2 ? g.w : Math.min(g.w * 1.3, g.w * 0.6 * (count - 1));
    const x = count > 1 ? span / 2 - (rank * span) / (count - 1) : g.w * 0.5;
    return { x: g.w / 2 + x, y: pileY + SPREAD_DROP[rank] * g.h, z: 0, r: SPREAD_TURN[rank], ry: 0, s: fit };
  }
  const offsets = phase === 'rest' ? BOOK_REST : BOOK_PEEK;
  const offset = offsets[rank] ?? { x: 0.06, y: 0, r: PILE_TURN[rank] ?? 0 };
  return {
    x: pileX + offset.x * g.w,
    y: pileY + offset.y * g.h + rank * 0.8 * g.scale,
    z: 0,
    r: offset.r,
    ry: 0,
    s: 1
  };
};

const placeFlap = (rank, count, phase, layout, g, pointer) => {
  const rest = FLAP_REST[rank] ?? FLAP_REST[FLAP_REST.length - 1];
  const floor = g.tabH + g.h - 5 * g.scale - g.docH / 2;
  const mid = (count - 1) / 2;
  if (phase === 'open') {
    const lift = g.tabH - g.h * 0.02;
    if (layout === 'stack') {
      const strip = Math.min(30 * g.scale, (g.h * 0.62) / Math.max(1, count - 1));
      const fit = 1.04 - rank * 0.05;
      return {
        x: g.w / 2,
        y: g.tabH + g.h * 0.1 - rank * strip - (g.docH * (1.04 - fit)) / 2,
        z: -rank * 18 * g.scale,
        r: 0,
        ry: 0,
        s: fit
      };
    }
    const gap = 12 * g.scale;
    const fit = Math.min(0.94, (g.w * 2.3 - gap * (count - 1)) / (count * g.docW));
    const step = g.docW * fit + gap;
    const tidy = layout === 'row';
    return {
      x: g.w / 2 + (rank - mid) * step,
      y: lift + (tidy ? 0 : SPREAD_DROP[rank] * g.h * 0.7),
      z: 0,
      r: tidy ? 0 : SPREAD_TURN[rank] * 0.55,
      ry: 0,
      s: fit
    };
  }
  const part = phase === 'receive' ? 1.7 : phase === 'peek' ? 1.3 : 1;
  const x = g.w / 2 + rest.x * g.w * part;
  if (phase === 'rest') return { x, y: floor - rest.rise * g.h, z: 0, r: rest.r, ry: 0, s: 1 };
  const near = phase === 'peek' && pointer != null ? Math.max(0, 1 - Math.abs(pointer - x) / (g.w * 0.32)) : 0;
  const rise = rest.rise + (phase === 'receive' ? 0.03 : 0.1);
  return { x, y: floor - rise * g.h - near * near * g.h * 0.09, z: 0, r: rest.r * 1.6, ry: 0, s: 1 };
};

const Folder = ({
  items,
  label,
  mode = 'flap',
  variant = 'solid',
  color = '#3d8bff',
  paperColor = '#ffffff',
  tabPosition = 'right',
  layout = 'spread',
  size = 1,
  openOn = 'click',
  open,
  defaultOpen = false,
  onOpenChange,
  onItemClick,
  onItemDrop,
  draggable = true,
  zoomOnClick = true,
  peek = true,
  intro = true,
  tilt = 0.5,
  bounce = 0.4,
  speed = 1,
  frost = 0.25,
  closeOnOutsideClick = true,
  theme = 'dark',
  className = '',
  style,
  children
}) => {
  const rootRef = useRef(null);
  const backRef = useRef(null);
  const frontRef = useRef(null);
  const groundRef = useRef(null);
  const castRef = useRef(null);
  const shadeRef = useRef(null);
  const glassRef = useRef(null);
  const itemRefs = useRef([]);
  const measureRef = useRef(null);
  const engineRef = useRef(null);
  const rendererRef = useRef(null);
  const [internalOpen, setInternalOpen] = useState(defaultOpen);
  const [labelWidth, setLabelWidth] = useState(0);
  const [outside, setOutside] = useState([]);
  const [gpu, setGpu] = useState(false);
  const isControlled = open !== undefined;
  const isOpen = isControlled ? Boolean(open) : internalOpen;
  const book = mode === 'book';
  const glass = variant === 'glass';

  const entries = useMemo(() => {
    const custom = Children.toArray(children).filter(isValidElement);
    const source = custom.length ? custom : items?.length ? items : DEFAULT_ITEMS;
    return source.slice(0, MAX_ITEMS);
  }, [children, items]);
  const count = entries.length;

  const scale = Math.max(0.3, Number(size) || 1);
  const g = measureFolder(book, scale, labelWidth, Boolean(label), tabPosition);
  const total = g.tabH + g.h;
  const view = book
    ? { x: -0.75 * g.w, y: -0.25 * total, width: 2.5 * g.w, height: 1.5 * total }
    : { x: -0.25 * g.w, y: -0.1 * total, width: 1.5 * g.w, height: 1.3 * total };

  useIsomorphicLayoutEffect(() => {
    const node = measureRef.current;
    if (!node) return undefined;
    let active = true;
    const measure = () => {
      if (active) setLabelWidth(node.offsetWidth);
    };
    measure();
    document.fonts?.ready.then(measure);
    return () => {
      active = false;
    };
  }, [label, scale]);

  const setOpen = useCallback(
    next => {
      const value = typeof next === 'function' ? next(isOpen) : next;
      if (!isControlled) setInternalOpen(value);
      if (value !== isOpen) onOpenChange?.(value);
    },
    [isControlled, isOpen, onOpenChange]
  );

  const setOpenRef = useRef(setOpen);
  setOpenRef.current = setOpen;

  const rgb = parseColor(color);
  const paper = parseColor(paperColor);
  const backTone = mixRgb(rgb, [0, 0, 0], 0.16);
  const insideTop = rgbString(mixRgb(rgb, [0, 0, 0], 0.08));
  const insideBottom = rgbString(backTone);

  const settingsRef = useRef(null);
  settingsRef.current = {
    open: isOpen,
    layout,
    openOn,
    peek,
    intro,
    draggable,
    zoomOnClick,
    closeOnOutsideClick,
    onItemClick,
    onItemDrop,
    tilt: clamp(tilt, 0, 1.5),
    bounce: clamp(bounce, 0, 1),
    speed: clamp(speed, 0.2, 3),
    frost: clamp(frost, 0, 1),
    count,
    entries,
    glass,
    light: theme === 'light',
    tint: rgb,
    insideTop,
    insideBottom,
    insideTone: [mixRgb(rgb, [0, 0, 0], 0.08).map(v => v / 255), backTone.map(v => v / 255)],
    content: `${mode}|${scale}|${paperColor}|${color}|${g.tabX}|${g.tabW}`,
    depth: Math.round(Math.max(g.w, g.h) * 5),
    view,
    g
  };

  useEffect(() => {
    const root = rootRef.current;
    if (!root) return undefined;
    const reduce = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches ?? false;

    const spring = value => ({ value, velocity: 0 });
    const state = {
      raf: 0,
      last: 0,
      ready: false,
      hovered: false,
      pressed: false,
      pointerX: 0,
      pointerY: 0,
      deskX: 0,
      deskY: 0,
      hoveredItem: -1,
      phase: 'rest',
      previous: 'rest',
      changedAt: 0,
      front: spring(0),
      rx: spring(0),
      ry: spring(0),
      lift: spring(0),
      squash: spring(1),
      items: [],
      focus: -1,
      drag: null,
      receiving: false,
      receiveUntil: 0,
      suppressClick: false,
      dropCount: 0,
      intro: { phase: 'done', start: 0, opening: false },
      anchor: spring(0),
      appear: 1,
      content: { key: '', entries: null, renderer: null }
    };

    const ensureItems = n => {
      while (state.items.length < n) {
        state.items.push({
          x: spring(0),
          y: spring(0),
          z: spring(0),
          r: spring(0),
          ry: spring(0),
          s: spring(1),
          hover: spring(0),
          mx: spring(0),
          my: spring(0),
          alpha: spring(1),
          place: 'inside',
          rank: 0,
          layer: 'inside',
          elevated: false,
          insertUntil: 0,
          insertFrom: null,
          outX: 0,
          outY: 0,
          outR: 0,
          outS: 1,
          outOrder: 0,
          localX: 0,
          localY: 0,
          fresh: true
        });
      }
      if (state.items.length > n) {
        state.items.length = n;
        if (state.focus >= n) state.focus = -1;
        syncOutside();
      }
    };

    const syncOutside = () => {
      const list = [];
      state.items.forEach((item, index) => {
        if (item.place === 'out') list.push(index);
      });
      setOutside(previous =>
        previous.length === list.length && previous.every((value, i) => value === list[i]) ? previous : list
      );
    };

    const integrate = (item, target, omega, zeta, dt) => {
      const k = omega * omega;
      const d = 2 * zeta * omega;
      const steps = Math.max(1, Math.ceil(dt / STEP));
      const step = dt / steps;
      for (let i = 0; i < steps; i++) {
        item.velocity += (k * (target - item.value) - d * item.velocity) * step;
        item.value += item.velocity * step;
      }
      return Math.abs(target - item.value) > 0.01 || Math.abs(item.velocity) > 0.01;
    };

    const snap = (item, value) => {
      item.value = value;
      item.velocity = 0;
    };

    const shiftOf = () => {
      const { g: geometry } = settingsRef.current;
      return geometry.book ? (geometry.w / 2) * clamp(-state.front.value / 180, 0, 1) : 0;
    };

    const toDesk = (clientX, clientY) => {
      const box = root.getBoundingClientRect();
      const kx = root.offsetWidth / (box.width || 1);
      const ky = root.offsetHeight / (box.height || 1);
      return [(clientX - box.left) * kx, (clientY - box.top) * ky];
    };

    const clipBounds = () => {
      const box = root.getBoundingClientRect();
      let left = 0;
      let top = 0;
      let right = window.innerWidth;
      let bottom = window.innerHeight;
      for (let node = root.parentElement; node && node !== document.body; node = node.parentElement) {
        const computed = getComputedStyle(node);
        if (/(hidden|clip|auto|scroll)/.test(`${computed.overflowX} ${computed.overflowY}`)) {
          const rect = node.getBoundingClientRect();
          left = Math.max(left, rect.left);
          top = Math.max(top, rect.top);
          right = Math.min(right, rect.right);
          bottom = Math.min(bottom, rect.bottom);
          break;
        }
      }
      const kx = root.offsetWidth / (box.width || 1);
      const ky = root.offsetHeight / (box.height || 1);
      return {
        left: (left - box.left) * kx,
        top: (top - box.top) * ky,
        right: (right - box.left) * kx,
        bottom: (bottom - box.top) * ky
      };
    };

    const overFolder = (x, y) => {
      const { g: geometry } = settingsRef.current;
      const shift = shiftOf();
      if (geometry.book) {
        const left = state.front.value < -90 ? shift - geometry.w : shift;
        return x >= left && x <= shift + geometry.w && y >= geometry.tabH * 0.5 && y <= geometry.tabH + geometry.h;
      }
      return x >= 0 && x <= geometry.w && y >= 0 && y <= geometry.tabH + geometry.h;
    };

    const inPocket = item => {
      const { g: geometry } = settingsRef.current;
      const halfW = (geometry.docW * item.s.value) / 2;
      const halfH = (geometry.docH * item.s.value) / 2;
      if (geometry.book) {
        if (state.front.value < -60) return false;
        const shift = shiftOf();
        return (
          item.x.value - halfW < shift + geometry.w &&
          item.x.value + halfW > shift &&
          item.y.value + halfH > geometry.tabH &&
          item.y.value - halfH < geometry.tabH + geometry.h
        );
      }
      if (state.front.value < -45) return false;
      return (
        item.y.value + halfH > geometry.frontTop + 4 * geometry.scale &&
        item.x.value + halfW > 0 &&
        item.x.value - halfW < geometry.w
      );
    };

    const velocityOf = samples => {
      if (samples.length < 2) return [0, 0];
      const first = samples[0];
      const last = samples[samples.length - 1];
      const span = Math.max(0.016, (last[0] - first[0]) / 1000);
      return [(last[1] - first[1]) / span, (last[2] - first[2]) / span];
    };

    const phaseOf = (s, time) => {
      if (s.open) return 'open';
      if (state.receiving || time < state.receiveUntil) return 'receive';
      if (s.peek && state.hovered && !state.drag?.active) return 'peek';
      return 'rest';
    };

    const place = (rank, inside, phase, s) => {
      if (s.g.book) return placeBook(rank, inside, phase, s.layout, s.g);
      const pointer = state.hovered ? ((state.pointerX + 1) / 2) * s.g.w : null;
      return placeFlap(rank, inside, phase, s.layout, s.g, pointer);
    };

    const approach = (item, slot, s) => {
      const { g: geometry } = s;
      if (item.insertFrom === 'side') {
        return { ...slot, x: Math.max(slot.x, geometry.w + geometry.docW * 0.54 * slot.s) };
      }
      return { ...slot, y: Math.min(slot.y, geometry.frontTop - geometry.docH * 0.5 * slot.s - 8 * geometry.scale) };
    };

    const frame = now => {
      state.raf = 0;
      const s = settingsRef.current;
      const { g: geometry } = s;
      ensureItems(s.count);
      const time = now / 1000;
      const dt = state.last ? Math.min(0.05, (now - state.last) / 1000) : 1 / 60;
      state.last = now;
      const zeta = reduce ? 1 : 1 - 0.72 * s.bounce;
      const frontOmega = TAU * (geometry.book ? 1.55 : 2) * s.speed;
      const itemOmega = TAU * 2.1 * s.speed;
      const soft = TAU * 1.6 * s.speed;
      const phase = phaseOf(s, time);
      if (phase !== state.phase) {
        state.previous = state.phase;
        state.phase = phase;
        state.changedAt = now;
      }
      const elapsed = (now - state.changedAt) / 1000;
      let busy = time < state.receiveUntil;

      const ranks = [];
      state.items.forEach((item, index) => {
        if (item.place === 'inside') ranks.push(index);
      });
      const inside = ranks.length;
      ranks.forEach((index, rank) => {
        state.items[index].rank = rank;
      });
      if (state.focus >= 0 && phase !== 'open' && state.items[state.focus]?.place === 'inside') state.focus = -1;

      const intro = state.intro;
      if (!state.ready) intro.opening = s.open;
      if (intro.phase === 'run' && !intro.opening && (s.open || state.drag?.active)) intro.phase = 'done';
      const introTime = intro.phase === 'run' ? time - intro.start : 0;
      const staged = intro.phase !== 'done' && !intro.opening;
      const closeAt = (0.16 + inside * 0.085 + 0.3) / s.speed;
      const holding = staged && introTime < closeAt;
      const dropAt = rank => (0.16 + (inside - 1 - rank) * 0.085) / s.speed;
      const introPose = (item, slot) =>
        geometry.book
          ? { ...slot, r: slot.r + (item.rank % 2 ? 7 : -6), s: slot.s * 1.12 }
          : {
              ...slot,
              y: slot.y - (geometry.h * 0.8 + geometry.docH * 0.5),
              r: slot.r + (item.rank % 2 ? 9 : -7)
            };
      if (intro.phase === 'run') {
        busy = true;
        if (introTime > (intro.opening ? 1.4 : closeAt + 1) / s.speed) intro.phase = 'done';
      }
      const appear = intro.phase === 'wait' ? 0 : intro.phase === 'run' ? clamp(introTime / (0.34 / s.speed), 0, 1) : 1;
      state.appear = 1 - (1 - appear) ** 3;

      const closing = state.previous === 'open' && phase !== 'open';
      const frontDelay = closing && !reduce ? ((geometry.book ? 0.1 : 0.06) + 0.035 * inside) / s.speed : 0;
      const frontPhase = elapsed < frontDelay ? state.previous : phase;
      const frontTarget = holding
        ? geometry.book
          ? -150
          : -42
        : (geometry.book ? BOOK_ANGLES : FLAP_ANGLES)[frontPhase];

      if (!state.ready) {
        state.ready = true;
        const opening = intro.phase !== 'done' && intro.opening;
        if (opening) {
          state.phase = 'rest';
          state.previous = 'rest';
        }
        snap(state.front, opening ? 0 : frontTarget);
        snap(state.anchor, staged ? 1 : 0);
        state.items.forEach(item => {
          const slot = place(item.rank, inside, opening ? 'rest' : phase, s);
          const target = staged ? introPose(item, slot) : slot;
          snap(item.x, target.x);
          snap(item.y, target.y);
          snap(item.z, target.z);
          snap(item.r, target.r);
          snap(item.ry, target.ry);
          snap(item.s, target.s);
          snap(item.alpha, staged ? 0 : 1);
          snap(item.hover, staged && geometry.book ? 3 : 0);
          item.fresh = false;
        });
      }

      if (intro.phase === 'wait') {
        write();
        state.last = 0;
        return;
      }

      busy = integrate(state.front, frontTarget, frontOmega, zeta, dt) || busy;
      const restitution = 0.2 + 0.35 * s.bounce;
      if (geometry.book && state.front.value < -180) {
        state.front.value = -360 - state.front.value;
        state.front.velocity = -state.front.velocity * restitution;
      } else if (state.front.value > 0) {
        state.front.value = -state.front.value;
        state.front.velocity = -state.front.velocity * restitution;
      }
      if (elapsed < frontDelay) busy = true;
      busy = integrate(state.anchor, staged ? 1 : 0, frontOmega, 1, dt) || busy;

      const engaged = state.hovered && !reduce;
      busy = integrate(state.rx, engaged ? -state.pointerY * 8 * s.tilt : 0, soft, 1, dt) || busy;
      busy = integrate(state.ry, engaged ? state.pointerX * 10 * s.tilt : 0, soft, 1, dt) || busy;
      busy = integrate(state.lift, state.hovered && phase !== 'open' ? 1 : 0, soft, 1, dt) || busy;
      busy = integrate(state.squash, state.pressed ? 0.975 : 1, TAU * 3.2, 0.6, dt) || busy;

      const opening = phase === 'open' && state.previous !== 'open';
      const drag = state.drag?.active ? state.drag : null;
      const hover = state.hoveredItem;
      const hovering = !drag && hover >= 0 && state.items[hover] ? state.items[hover] : null;
      const lead =
        hovering && hovering.place === 'inside' && phase === 'open' ? place(hovering.rank, inside, 'open', s) : null;
      const focusScale = clamp(((geometry.tabH + geometry.h) * 1.18) / geometry.docH, 1.2, 2.2);
      const focusY = geometry.book ? geometry.tabH + geometry.h / 2 : geometry.tabH + geometry.h * 0.36;

      state.items.forEach((item, index) => {
        if (item.fresh) {
          const start = place(item.rank, inside, 'rest', s);
          snap(item.x, start.x);
          snap(item.y, start.y);
          snap(item.r, start.r);
          item.fresh = false;
        }
        let target;
        let omega = itemOmega;
        let damping = zeta;
        let lift = 0;
        let fade = 1;
        let magnet = false;
        if (state.focus === index) {
          target = { x: geometry.w / 2, y: focusY, z: 0, r: 0, ry: 0, s: focusScale };
          lift = 2.4;
          item.layer = 'focus';
        } else if (drag && drag.index === index) {
          const [vx] = velocityOf(drag.samples);
          target = {
            x: state.deskX + drag.grabX,
            y: state.deskY + drag.grabY,
            z: 0,
            r: clamp(vx * 0.012, -14, 14),
            ry: 0,
            s: drag.scale * 1.05
          };
          omega = TAU * 5;
          damping = 0.78;
          lift = 1.4;
          if (!item.elevated && !inPocket(item)) item.elevated = true;
          item.layer = item.elevated ? 'drag' : 'inside';
        } else if (item.place === 'out') {
          target = { x: item.outX, y: item.outY, z: 0, r: item.outR, ry: 0, s: item.outS };
          lift = hover === index ? 1 : 0.15;
          magnet = hover === index;
          item.layer = 'out';
        } else {
          const order = opening ? (geometry.book ? inside - 1 - item.rank : item.rank) : item.rank;
          const delay = reduce
            ? 0
            : opening
              ? ((geometry.book ? 0.16 : 0.05) + order * (geometry.book ? 0.055 : 0.045)) / s.speed
              : (order * 0.03) / s.speed;
          const active = elapsed >= delay ? phase : state.previous;
          target = place(item.rank, inside, active, s);
          if (elapsed < delay) busy = true;
          if (staged && introTime < dropAt(item.rank)) {
            target = introPose(item, target);
            fade = 0;
            lift = geometry.book ? 3 : 0;
            item.layer = 'inside';
          } else if (item.insertUntil > time) {
            busy = true;
            target = approach(item, target, s);
            item.layer = 'drag';
            lift = 0.6;
          } else {
            item.insertUntil = 0;
            item.elevated = false;
            item.layer = 'inside';
            if (lead && active === 'open') {
              if (hover === index) {
                target = { ...target, y: target.y - 6 * geometry.scale, r: target.r * 0.2, ry: 0, s: target.s * 1.05 };
                lift = 1;
                magnet = true;
              } else {
                const distance = target.x - lead.x;
                target = {
                  ...target,
                  x:
                    target.x +
                    Math.sign(distance) * 12 * geometry.scale * Math.max(0, 1 - Math.abs(distance) / (geometry.w * 1.1))
                };
                lift = 0.2;
              }
            } else if (active === 'open') {
              lift = 0.2;
            }
          }
        }
        busy = integrate(item.x, target.x, omega, damping, dt) || busy;
        busy = integrate(item.y, target.y, omega, damping, dt) || busy;
        if (!geometry.book && item.layer === 'inside') {
          const tilt = (item.r.value * Math.PI) / 180;
          const reach =
            ((geometry.docW * Math.abs(Math.sin(tilt)) + geometry.docH * Math.abs(Math.cos(tilt))) * item.s.value) / 2;
          const floor = geometry.tabH + geometry.h - 2 * geometry.scale - reach;
          if (item.y.value > floor) {
            item.y.value = floor;
            if (item.y.velocity > 0) item.y.velocity *= -0.25;
          }
        }
        busy = integrate(item.z, target.z, itemOmega, zeta, dt) || busy;
        busy = integrate(item.r, target.r, omega, damping, dt) || busy;
        busy = integrate(item.ry, target.ry, itemOmega, zeta, dt) || busy;
        busy = integrate(item.s, target.s, itemOmega, zeta, dt) || busy;
        busy = integrate(item.hover, lift, itemOmega, zeta, dt) || busy;
        busy = integrate(item.alpha, fade, TAU * 3 * s.speed, 1, dt) || busy;
        busy = integrate(item.mx, magnet ? item.localX * 7 * geometry.scale : 0, soft, 0.85, dt) || busy;
        busy = integrate(item.my, magnet ? item.localY * 7 * geometry.scale : 0, soft, 0.85, dt) || busy;
      });

      write();
      if (busy || drag) state.raf = requestAnimationFrame(frame);
      else state.last = 0;
    };

    const refreshContent = (renderer, s) => {
      if (
        state.content.key === s.content &&
        state.content.entries === s.entries &&
        state.content.renderer === renderer
      ) {
        return;
      }
      state.content = { key: s.content, entries: s.entries, renderer };
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const keys = new Set(['back']);
      renderer.upload('back', paintBack(s.g, s.insideTop, s.insideBottom, dpr));
      itemRefs.current.slice(0, s.count).forEach((node, index) => {
        if (!node) return;
        const key = `item-${index}`;
        keys.add(key);
        let result = rasterize(node, dpr, false);
        try {
          renderer.upload(key, result.canvas);
        } catch {
          result = rasterize(node, dpr, true);
          renderer.upload(key, result.canvas);
        }
        result.pending.forEach(image => image.addEventListener('load', invalidate, { once: true }));
      });
      renderer.prune(keys);
    };

    const write = () => {
      const s = settingsRef.current;
      const { w, h, tabH, frontTop, frontH, docW, docH, scale, book: isBook } = s.g;
      const pivotX = w / 2;
      const pivotY = tabH + h / 2;
      const theta = state.front.value;
      const angle = (theta * Math.PI) / 180;
      const unfold = isBook ? clamp(-theta / 180, 0, 1) : 0;
      const shift = (w / 2) * unfold * (1 - state.anchor.value);
      const zoom = (1 + state.lift.value * 0.012) * state.squash.value * (0.94 + 0.06 * state.appear);
      root.style.opacity = state.appear < 0.999 ? state.appear.toFixed(3) : '';
      const desk = chain(
        move(pivotX, pivotY),
        turnX(state.rx.value),
        turnY(state.ry.value),
        stretch(zoom, zoom),
        move(-pivotX, -pivotY)
      );
      const folder = multiply(desk, move(shift, 0));
      const flipped = isBook && theta < -90;
      const frontZ = flipped ? '3' : '40';

      if (backRef.current) {
        backRef.current.style.transform = toCss(folder);
        backRef.current.style.setProperty('--folder-gutter', unfold.toFixed(3));
        backRef.current.style.setProperty(
          '--folder-label',
          (isBook ? 1 : 1 - clamp((-theta - 18) / 26, 0, 1)).toFixed(3)
        );
      }

      const frontMatrix = isBook
        ? chain(folder, move(0, frontTop, 2 * scale * (1 - unfold)), turnY(theta))
        : chain(folder, move(0, tabH + h, 2 * scale), turnX(theta), move(0, -frontH));
      const facing = isBook
        ? Math.sin(angle) * -0.42 + Math.cos(angle) * 0.9
        : Math.sin(angle) * 0.5 + Math.cos(angle) * 0.86;
      const light = (flipped ? -facing : facing) / (isBook ? 0.9 : 0.86);
      const glint = clamp((light - 1) * 0.9, 0, 0.18);
      const dim = clamp((1 - light) * (isBook ? 0.5 : 0.22), 0, 0.5);

      const front = frontRef.current;
      if (front) {
        front.style.transform = toCss(frontMatrix);
        front.style.zIndex = frontZ;
        front.dataset.face = flipped ? 'inner' : 'outer';
        front.style.setProperty('--folder-glint', glint.toFixed(3));
        front.style.setProperty('--folder-dim', dim.toFixed(3));
      }

      const rise = isBook ? Math.max(0, Math.sin(-angle)) : 0;
      if (groundRef.current) {
        groundRef.current.style.transform = toCss(multiply(folder, move(0, isBook ? tabH : tabH + h)));
        groundRef.current.style.opacity = (0.75 + state.lift.value * 0.25).toFixed(3);
      }
      if (castRef.current) {
        castRef.current.style.transform = toCss(
          chain(folder, move(w * rise * 0.12, frontTop + h * rise * 0.04), stretch(Math.cos(angle), 1))
        );
        castRef.current.style.opacity = (flipped ? 1 - rise * 0.7 : 0).toFixed(3);
      }
      if (shadeRef.current) {
        const edge = w * Math.cos(angle) + w * rise * 0.36;
        shadeRef.current.style.transform = toCss(
          chain(folder, move(0, frontTop + h * rise * 0.03), stretch(edge / w, 1))
        );
        shadeRef.current.style.zIndex = edge > 0 ? '39' : '2';
        shadeRef.current.style.opacity = (clamp(rise * 4, 0, 1) * (1 - rise * 0.45)).toFixed(3);
      }

      const outs = state.items
        .map((item, index) => [item, index])
        .filter(([item]) => item.layer === 'out')
        .sort((a, b) => a[0].outOrder - b[0].outOrder)
        .map(([, index]) => index);
      const matrices = [];
      state.items.forEach((item, index) => {
        const node = itemRefs.current[index];
        const z = 3 * scale + item.z.value + item.hover.value * 26 * scale;
        const matrix = chain(
          desk,
          move(item.x.value + item.mx.value, item.y.value + item.my.value, z),
          turnY(item.ry.value),
          turnZ(item.r.value),
          stretch(item.s.value, item.s.value),
          move(-docW / 2, -docH / 2)
        );
        let layer = 10 + s.count - item.rank;
        if (item.layer === 'inside' && state.phase === 'open' && state.hoveredItem === index) layer = 30;
        if (item.layer === 'out') layer = LAYERS.out + outs.indexOf(index);
        if (item.layer === 'drag') layer = LAYERS.drag;
        if (item.layer === 'focus') layer = LAYERS.focus;
        matrices.push({ index, matrix, layer, alpha: clamp(item.alpha.value, 0, 1), inside: item.layer === 'inside' });
        if (!node) return;
        node.style.transform = toCss(matrix);
        node.style.zIndex = String(layer);
        node.style.setProperty('--folder-lift', clamp(item.hover.value, 0, 2.4).toFixed(3));
        node.style.opacity = item.alpha.value < 0.995 ? Math.max(0, item.alpha.value).toFixed(3) : '';
      });

      const canvas = glassRef.current;
      const renderer = rendererRef.current;
      if (!canvas || !renderer || !s.glass) return;
      canvas.style.zIndex = frontZ;
      refreshContent(renderer, s);
      const layers = [];
      if (!flipped) {
        layers.push({ key: 'back', matrix: folder, width: w, height: tabH + h, alpha: 1 });
        matrices
          .filter(entry => entry.inside)
          .sort((a, b) => a.layer - b.layer)
          .forEach(entry =>
            layers.push({
              key: `item-${entry.index}`,
              matrix: entry.matrix,
              width: docW,
              height: docH,
              alpha: entry.alpha
            })
          );
      }
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      renderer.render({
        dpr,
        depth: s.depth,
        origin: [pivotX, pivotY],
        view: s.view,
        layers,
        glass: {
          matrix: frontMatrix,
          width: w,
          height: frontH,
          radii: isBook ? [0, s.g.r, s.g.r, 0] : [s.g.r, s.g.r, s.g.r, s.g.r],
          spine: isBook ? w * 2 : 0,
          bleed: flipped ? 2 : 0,
          morph: isBook ? clamp((unfold - 0.55) / 0.45, 0, 1) ** 2 : 0,
          insideTop: s.insideTone[0],
          insideBottom: s.insideTone[1],
          tabRatio: tabH / (tabH + h),
          gutter: [12 * scale, isBook ? 0.12 * unfold : 0],
          bevel: 12 * scale,
          strength: 14 * scale,
          split: 0.26,
          lens: 0.02,
          frost: s.frost * 6 * scale,
          tint: [s.tint[0] / 255, s.tint[1] / 255, s.tint[2] / 255, s.light ? 0.1 : 0.14],
          haze: 0.04 + s.frost * 0.1,
          dim: dim * 0.8,
          glint,
          shine: s.light ? 0.72 : 0.85,
          light: flipped ? [0.55, -0.83] : [-0.55, -0.83]
        }
      });
    };

    const wake = () => {
      if (!state.raf) state.raf = requestAnimationFrame(frame);
    };

    const beginIntro = () => {
      if (state.intro.phase !== 'wait') return;
      state.intro.phase = 'run';
      state.intro.start = performance.now() / 1000;
      wake();
    };

    const invalidate = () => {
      state.content.key = '';
      wake();
    };

    const updateReceiving = () => {
      const drag = state.drag;
      const item = drag ? state.items[drag.index] : null;
      state.receiving = Boolean(
        drag?.active && item && (item.place === 'out' || item.elevated) && overFolder(state.deskX, state.deskY)
      );
    };

    const startDrag = drag => {
      const item = state.items[drag.index];
      if (!item) return;
      drag.active = true;
      drag.grabX = item.x.value - drag.downX;
      drag.grabY = item.y.value - drag.downY;
      drag.scale = item.place === 'out' ? item.outS : item.s.value;
      drag.clip = clipBounds();
      state.suppressClick = true;
      if (state.focus === drag.index) state.focus = -1;
      item.elevated = item.place === 'out' || !inPocket(item);
      root.dataset.dragging = '';
    };

    const drop = (drag, cancelled) => {
      const s = settingsRef.current;
      const item = state.items[drag.index];
      state.receiving = false;
      delete root.dataset.dragging;
      if (!item) return;
      const time = performance.now() / 1000;
      const [vx, vy] = cancelled ? [0, 0] : velocityOf(drag.samples);
      if (overFolder(state.deskX, state.deskY)) {
        const entering = item.place === 'out' || item.elevated;
        item.place = 'inside';
        if (entering && !reduce) {
          item.insertUntil = time + 0.24 / s.speed;
          item.insertFrom = s.g.book ? (state.front.value < -90 ? null : 'side') : 'top';
          if (!item.insertFrom) item.insertUntil = 0;
          state.receiveUntil = item.insertUntil ? item.insertUntil + 0.14 / s.speed : 0;
        }
        item.elevated = false;
        syncOutside();
        s.onItemDrop?.(s.entries[drag.index], drag.index, true);
        return;
      }
      const clip = drag.clip ?? clipBounds();
      const halfW = (s.g.docW * drag.scale) / 2;
      const halfH = (s.g.docH * drag.scale) / 2;
      const x = state.deskX + drag.grabX + clamp(vx, -2400, 2400) * 0.09;
      const y = state.deskY + drag.grabY + clamp(vy, -2400, 2400) * 0.09;
      item.place = 'out';
      item.elevated = true;
      const margin = 8 * s.g.scale;
      const reachX = halfW * 1.08 + margin;
      const reachY = halfH * 1.08 + margin;
      item.outX = clamp(x, clip.left + reachX, Math.max(clip.left + reachX, clip.right - reachX));
      item.outY = clamp(y, clip.top + reachY, Math.max(clip.top + reachY, clip.bottom - reachY));
      item.outR = clamp(item.r.value * 0.5 + clamp(vx, -2400, 2400) * 0.003 + DROP_TURN[drag.index % 6] * 0.6, -12, 12);
      item.outS = drag.scale;
      state.dropCount += 1;
      item.outOrder = state.dropCount;
      syncOutside();
      s.onItemDrop?.(s.entries[drag.index], drag.index, false);
    };

    const onMove = event => {
      const drag = state.drag;
      if (drag && event.pointerId === drag.id) {
        const [x, y] = toDesk(event.clientX, event.clientY);
        state.deskX = x;
        state.deskY = y;
        const now = performance.now();
        drag.samples.push([now, x, y]);
        while (drag.samples.length > 2 && now - drag.samples[0][0] > 100) drag.samples.shift();
        if (!drag.active) {
          const threshold = event.pointerType === 'touch' ? 8 : 4;
          if (Math.hypot(event.clientX - drag.clientX, event.clientY - drag.clientY) > threshold) startDrag(drag);
        }
        if (drag.active) updateReceiving();
        wake();
      }
      if (event.pointerType === 'touch') return;
      const box = root.getBoundingClientRect();
      state.pointerX = clamp(((event.clientX - box.left) / box.width) * 2 - 1, -1.5, 1.5);
      state.pointerY = clamp(((event.clientY - box.top) / box.height) * 2 - 1, -1.5, 1.5);
      const target = event.target.closest?.('[data-folder-item]');
      const index = target && root.contains(target) ? Number(target.getAttribute('data-folder-item')) : -1;
      state.hoveredItem = index;
      if (target && index >= 0 && !state.drag?.active) {
        const rect = target.getBoundingClientRect();
        const item = state.items[index];
        if (item) {
          item.localX = clamp(((event.clientX - rect.left) / rect.width) * 2 - 1, -1, 1);
          item.localY = clamp(((event.clientY - rect.top) / rect.height) * 2 - 1, -1, 1);
        }
      }
      if (!state.hovered) {
        state.hovered = true;
        if (settingsRef.current.openOn === 'hover') setOpenRef.current(true);
      }
      wake();
    };

    const onLeave = event => {
      if (event.pointerType === 'touch' || state.drag?.active) return;
      state.hovered = false;
      state.pressed = false;
      state.hoveredItem = -1;
      if (settingsRef.current.openOn === 'hover') setOpenRef.current(false);
      wake();
    };

    const onDown = event => {
      if (event.button > 0) return;
      state.suppressClick = false;
      const target = event.target.closest?.('[data-folder-item]');
      if (target && root.contains(target) && settingsRef.current.draggable) {
        const [x, y] = toDesk(event.clientX, event.clientY);
        state.deskX = x;
        state.deskY = y;
        state.drag = {
          index: Number(target.getAttribute('data-folder-item')),
          id: event.pointerId,
          clientX: event.clientX,
          clientY: event.clientY,
          downX: x,
          downY: y,
          grabX: 0,
          grabY: 0,
          scale: 1,
          clip: null,
          active: false,
          samples: [[performance.now(), x, y]]
        };
        try {
          target.setPointerCapture(event.pointerId);
        } catch {
          state.drag.id = event.pointerId;
        }
      } else {
        state.pressed = true;
      }
      wake();
    };

    const onUp = event => {
      state.pressed = false;
      const drag = state.drag;
      if (drag && event.pointerId === drag.id) {
        state.drag = null;
        if (drag.active) drop(drag, event.type === 'pointercancel');
      }
      wake();
    };

    const onDocumentDown = event => {
      if (root.contains(event.target)) return;
      const s = settingsRef.current;
      if (state.focus >= 0) {
        state.focus = -1;
        wake();
      }
      if (s.open && s.closeOnOutsideClick) setOpenRef.current(false);
    };

    const onKey = event => {
      if (event.key !== 'Escape') return;
      if (state.focus >= 0) {
        state.focus = -1;
        wake();
        return;
      }
      const s = settingsRef.current;
      if (s.open && s.closeOnOutsideClick) setOpenRef.current(false);
    };

    root.addEventListener('pointermove', onMove);
    root.addEventListener('pointerleave', onLeave);
    root.addEventListener('pointerdown', onDown);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
    document.addEventListener('pointerdown', onDocumentDown);
    document.addEventListener('keydown', onKey);
    document.fonts?.ready.then(invalidate);

    let observer = null;
    if (settingsRef.current.intro && !reduce) {
      state.intro.phase = 'wait';
      root.style.opacity = '0';
      if (typeof IntersectionObserver === 'undefined') {
        beginIntro();
      } else {
        observer = new IntersectionObserver(
          entries => {
            if (!entries.some(entry => entry.isIntersecting)) return;
            observer?.disconnect();
            beginIntro();
          },
          { threshold: 0.2 }
        );
        observer.observe(root);
      }
    }

    engineRef.current = {
      wake,
      invalidate,
      consumeClick: () => {
        if (!state.suppressClick) return false;
        state.suppressClick = false;
        return true;
      },
      interactive: index => settingsRef.current.open || state.items[index]?.place === 'out' || state.focus === index,
      select: index => {
        const s = settingsRef.current;

};

const WDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const fmtDay = d => `${WDAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
const fmtShort = d => `${d.getDate()} ${MONTHS[d.getMonth()]}`;
const fmtMin = m => (m >= 60 ? `${Math.floor(m / 60)} h ${String(Math.round(m % 60)).padStart(2, '0')} min` : `${Math.round(m)} min`);
const daysAgo = n => new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate() - n);

/* ---- the year of activity (same seed and fixes as the Overview, so numbers agree) ---- */
const makeYear = () => {
  const rand = mulberry32(1707);
  const days = [];
  const total = 371;
  for (let i = total - 1; i >= 0; i--) {
    const date = daysAgo(i);
    const dow = date.getDay();
    const weekend = dow === 0 || dow === 6;
    const holiday = date.getMonth() === 7 && date.getDate() >= 10 && date.getDate() <= 18;
    let count = 0;
    if (!holiday && rand() > (weekend ? 0.38 : 0.12)) {
      const g = (rand() + rand() + rand() - 1.5) * 0.9;
      count = Math.max(1, Math.round(Math.exp(3.25 + g) * (weekend ? 0.55 : 1)));
    }
    days.push({ date, count });
  }
  const n = days.length;
  // a 41-day streak in spring, so "Longest this year: 41" on the Overview is true
  for (let k = 0; k < 41; k++) if (days[n - 230 + k].count === 0) days[n - 230 + k].count = 4 + Math.floor(rand() * 18);
  days[n - 231].count = 0; days[n - 189].count = 0;
  for (let k = 1; k <= 23; k++) if (days[n - k].count === 0) days[n - k].count = 6 + Math.floor(rand() * 20);
  days[n - 24].count = 0;
  days[n - 1].count = 47;
  days[n - 12].count = 38;
  return days;
};
const YEAR = makeYear();
const EMPTY_YEAR = YEAR.map(d => ({ date: d.date, count: 0 }));

/* ---- theme: follow Windows by default; ?theme=light|dark for review and screenshots ---- */
const QS = new URLSearchParams(location.search);
const useTheme = () => {
  const query = window.matchMedia('(prefers-color-scheme: dark)');
  const [choice, setChoice] = useState(['light', 'dark'].includes(QS.get('theme')) ? QS.get('theme') : 'system');
  const [systemDark, setSystemDark] = useState(query.matches);
  useEffect(() => {
    const on = e => setSystemDark(e.matches);
    query.addEventListener('change', on);
    return () => query.removeEventListener('change', on);
  }, []);
  useEffect(() => {
    if (choice === 'system') delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = choice;
  }, [choice]);
  const mode = choice === 'system' ? (systemDark ? 'dark' : 'light') : choice;
  return { choice, setChoice, mode, systemDark };
};

const usePrefersReduced = () => {
  const q = window.matchMedia('(prefers-reduced-motion: reduce)');
  const [r, setR] = useState(q.matches);
  useEffect(() => {
    const on = e => setR(e.matches);
    q.addEventListener('change', on);
    return () => q.removeEventListener('change', on);
  }, []);
  return r;
};

/* ---- review-only state switcher: data / loading / waking / error / empty, plus a real cold start ---- */
const STATES = [['data', 'Data'], ['loading', 'Loading'], ['waking', 'Waking up'], ['error', 'Error'], ['empty', 'Empty']];
const useReview = () => {
  const start = STATES.some(s => s[0] === QS.get('state')) ? QS.get('state') : 'data';
  const [state, setState] = useState(start);
  const [since, setSince] = useState(() => Date.now() - (start === 'waking' ? 14000 : 0));
  const timers = useRef([]);
  const clear = () => { timers.current.forEach(clearTimeout); timers.current = []; };
  const go = s => { clear(); setState(s); setSince(Date.now() - (s === 'waking' ? 14000 : 0)); };
  const later = (ms, fn) => timers.current.push(setTimeout(fn, ms));
  // the decided rule (Doc 08): a first request slower than 3 s turns "loading" into "waking up"
  const cold = () => { go('loading'); setSince(Date.now()); later(3000, () => setState('waking')); later(16000, () => setState('data')); };
  const retry = () => { go('loading'); later(1200, () => setState('data')); };
  useEffect(() => clear, []);
  return { state, since, go, cold, retry };
};

/* ---- toasts: React Bits SwipeToast, one at a time ---- */
const useToasts = () => {
  const [t, setT] = useState(null);
  const say = (title, description = '', extra = {}) => setT({ key: Date.now(), title, description, ...extra });
  const node = t && (
    <SwipeToast key={t.key} title={t.title} description={t.description} icon={t.icon ?? I.info}
                actionLabel={t.actionLabel} onAction={t.onAction}
                background="var(--ink)" color="var(--bg)" fuseColor="var(--accent)"
                width={380} radius={10} duration={t.duration ?? 4200} closeButton
                onClose={() => setT(cur => (cur && cur.key === t.key ? null : cur))} />
  );
  return { say, node };
};

}

  const [now, setNow] = useState(Date.now());
  useEffect(() => { const t = setInterval(() => setNow(Date.now()), 100); return () => clearInterval(t); }, []);

  return (

        <Radar color={ctx.accent} lightMode={!ctx.dark} speed={0.6} ringCount={5} spokeCount={8} targets={1}

/* ---- calendar heatmap (custom SVG, Doc 08; identical to the Overview's) ---- */
const RAMPS = {
  light: ['#EDEDEA', '#86B6EF', '#3987E5', '#256ABF', '#104281'],
  dark: ['#2A3440', '#1C5CAB', '#2A78D6', '#5598E7', '#9EC5F4']
};
const quartiles = values => {
  const s = values.filter(v => v > 0).sort((a, b) => a - b);
  if (!s.length) return [0, 0, 0];
  const at = p => s[Math.min(s.length - 1, Math.floor(p * (s.length - 1)))];
  return [at(0.25), at(0.5), at(0.75)];
};
function CalendarHeatmap({ days, mode, cell = 12 }) {
  const CELL = cell, GAP = 3, STEP = CELL + GAP, LEFT = 30, TOP = 18;
  const ramp = RAMPS[mode];
  const [q1, q2, q3] = useMemo(() => quartiles(days.map(d => d.count)), [days]);
  const level = c => (c === 0 ? 0 : c <= q1 ? 1 : c <= q2 ? 2 : c <= q3 ? 3 : 4);
  const [tip, setTip] = useState(null);
  const first = days[0].date;
  const lead = (first.getDay() + 6) % 7;
  const cells = days.map((d, i) => ({ ...d, col: Math.floor((i + lead) / 7), row: (i + lead) % 7 }));
  const cols = cells[cells.length - 1].col + 1;
  const months = [];
  cells.forEach(c => { if (c.date.getDate() === 1) months.push({ col: c.row === 0 ? c.col : c.col + 1, name: MONTHS[c.date.getMonth()] }); });
  const width = LEFT + cols * STEP - GAP;
  const height = TOP + 7 * STEP - GAP;
  const total = days.reduce((a, d) => a + d.count, 0);
  const active = days.filter(d => d.count > 0).length;
  return (
    <>
      <div className="cal-body">
        <svg className="cal-svg" width={width} height={height} role="img"
             aria-label={`Activity calendar: ${total.toLocaleString()} commands on ${active} days over the last year`}
             onMouseLeave={() => setTip(null)}>
          {months.map(m => <text key={`${m.name}${m.col}`} x={LEFT + m.col * STEP} y={11}>{m.name}</text>)}
          {['Mon', '', 'Wed', '', 'Fri', '', ''].map((d, r) => d && <text key={d} x={0} y={TOP + r * STEP + 10}>{d}</text>)}
          {cells.map((c, i) => (
            <rect key={i} className={`day${tip && tip.i === i ? ' hot' : ''}`}
                  x={LEFT + c.col * STEP} y={TOP + c.row * STEP} width={CELL} height={CELL} rx={2.5}
                  fill={ramp[level(c.count)]}
                  onMouseEnter={() => setTip({ i, x: LEFT + c.col * STEP + CELL / 2 + 24, y: TOP + c.row * STEP + 14, c })} />
          ))}
        </svg>
        {tip && (
          <div className="cal-tip" style={{ left: tip.x, top: tip.y }}>
            {fmtDay(tip.c.date)} · <b>{tip.c.count}</b> {tip.c.count === 1 ? 'command' : 'commands'}
          </div>
        )}
      </div>
      <div className="cal-key">
        <span>Grey = no commands. Blue steps = quartiles of your active days.</span>
        <span className="ramp">Less {ramp.map(c => <span key={c} className="sw" style={{ background: c }} />)} More</span>
      </div>
    </>
  );
}

  ['cancel', '', '', 'cancelled', {}],
  ['refresh', 'browser.refresh', 'press_keys', 'executed', {}]
];
const makeHistory = (count = 320) => {
  const rand = mulberry32(42);
  const rows = [];
  let t = new Date(2026, 9, 17, 14, 32).getTime();
  const fixed = [0, 1, 2, 3, 4, 5, 6, 7];
  for (let i = 0; i < count; i++) {
    const k = i < fixed.length ? fixed[i] : Math.floor(rand() * SAYINGS.length);
    const [heard, cmd, action, result, slots] = SAYINGS[k];
    const mode = rand() < 0.72 ? 'wake' : rand() < 0.8 ? 'push_to_talk' : 'continuous';
    const silence = mode === 'push_to_talk' ? 0 : 640 + Math.round(rand() * 110);
    const stt = 240 + Math.round(rand() * 230);
    const act = action ? 60 + Math.round(rand() * 150) : 0;
    const other = 40 + Math.round(rand() * 30);
    const sttConf = result === 'not_matched' ? 0.62 + rand() * 0.3 : 0.78 + rand() * 0.21;
    const matchConf = result === 'not_matched' ? 0.2 + rand() * 0.35 : result === 'low_confidence' ? 0.66 + rand() * 0.1 : heard.includes('spotfy') ? 0.84 : 0.88 + rand() * 0.12;
    rows.push({
      uuid: `c-${i}`, ts: new Date(t), heard, cmd, action, result, slots, mode,
      ms: { silence, stt, action: act, other, total: silence + stt + act + other },
      sttConf, matchConf, model: rand() < 0.85 ? 'base.en' : 'tiny.en',
      verdict: heard === 'open spotfy' ? 'wrong' : i % 9 === 3 ? 'right' : '',
      error: result === 'failed' ? 'App not found: "Figma" is not installed' : ''
    });
    t -= (2 + rand() * (i % 30 === 29 ? 600 : 18)) * 60000;
  }
  return rows;
};
const HISTORY = makeHistory();

    { id: 'volume', patterns: ['volume {level}', 'set volume to {level}'], action: 'set_volume', params: 'level 0–100', uses: 44 }
  ],
  browser: [
    { id: 'new_tab', patterns: ['new tab', 'open a new tab'], action: 'press_keys', params: 'ctrl+t', when: 'Google Chrome', uses: 96 },
    { id: 'close_tab', patterns: ['close tab', 'close this tab'], action: 'press_keys', params: 'ctrl+w', when: 'Google Chrome', uses: 73 },
    { id: 'reopen_tab', patterns: ['reopen tab', 'bring that tab back'], action: 'press_keys', params: 'ctrl+shift+t', when: 'Google Chrome', uses: 39 },
    { id: 'next_tab', patterns: ['next tab'], action: 'press_keys', params: 'ctrl+tab', when: 'Google Chrome', uses: 88 },
    { id: 'refresh', patterns: ['refresh', 'reload'], action: 'press_keys', params: 'f5', when: 'Google Chrome', uses: 52 }
  ],
  terminal: [
    { id: 'new_tab', patterns: ['new tab', 'open a new tab'], action: 'press_keys', params: 'ctrl+shift+t', when: 'Windows Terminal', uses: 41 },
    { id: 'close_tab', patterns: ['close tab', 'close this tab'], action: 'press_keys', params: 'ctrl+shift+w', when: 'Windows Terminal', uses: 30 },
    { id: 'split_pane', patterns: ['split pane', 'split the screen'], action: 'press_keys', params: 'alt+shift+d', when: 'Windows Terminal', uses: 18 }
  ],
  media: [
    { id: 'pause', patterns: ['pause', 'stop the music'], action: 'press_keys', params: 'media play/pause', uses: 64 },
    { id: 'next', patterns: ['next song', 'skip'], action: 'press_keys', params: 'media next', uses: 57 },
    { id: 'volume_up', patterns: ['volume up', 'louder'], action: 'press_keys', params: 'volume up ×5', uses: 80 },
    { id: 'volume_down', patterns: ['volume down', 'quieter'], action: 'press_keys', params: 'volume down ×5', uses: 49 }
  ],
  routines: [
    { id: 'dsa', patterns: ['dsa', 'start dsa', 'dsa mode'], action: 'routine', steps: ['launch_app CLion', 'open_url takeuforward.org', 'open_url leetcode.com'], uses: 47 },
    { id: 'gym', patterns: ['gym', 'workout time'], action: 'routine', steps: ['launch_app Spotify', 'open_url spotify: workout'], uses: 12 }
  ]
};
const FILES = Object.keys(LIB);
const PRIMITIVES = ['open_url', 'launch_app', 'close_app', 'press_keys', 'set_volume', 'routine'];
const EDIT_STATUS = {
  waiting: { mark: 'running', word: 'Waiting for laptop', note: 'Applied on the next sync' },
  applied: { mark: 'done', word: 'Applied', note: 'Now in the command file' },
  invalid: { mark: 'failed', word: 'Invalid', note: '' },
  overridden: { mark: 'overridden', word: 'Overridden', note: 'The file changed on the laptop first' }
};
const EDITS0 = [
  { id: 'e4', what: 'Add', cmd: 'browser.duplicate_tab', when: '10:42', status: 'waiting' },
  { id: 'e3', what: 'Edit', cmd: 'core.search', when: 'Yesterday 21:10', status: 'applied' },
  { id: 'e2', what: 'Add', cmd: 'media.mute', when: 'Yesterday 20:55', status: 'invalid', reason: 'press_keys has no key called “mute”; did you mean “volume_mute”?' },
  { id: 'e1', what: 'Edit', cmd: 'routines.dsa', when: 'Thu 18:02', status: 'overridden' }
];

const Pattern = ({ p }) => (
  <span className="pat">{p.split(/(\{\w+\})/).map((part, i) => (part.startsWith('{') ? <em key={i}>{part}</em> : part))}</span>
);

function CommandCard({ file, c, ctx, onEdit }) {
  return (
    <SpotlightCard className="card cmd-card" theme={ctx.mode} spotlightColor={ctx.dark ? 'rgba(85,152,231,0.25)' : 'rgba(42,120,214,0.12)'}
                   intensity={0.6} spotlightSize={260} borderGlow={0.5} flare={false}>
      <div className="cmd-head">
        <code className="cmd-id">{file}.{c.id}</code>
        {c.risk === 'high' && <span className="risk">{I.warn} High risk</span>}
        <button className="icon-btn" aria-label={`Edit ${file}.${c.id}`} onClick={() => onEdit(file, c)}>{I.edit}</button>
      </div>
      <div className="pats" aria-label="Say it like this">{c.patterns.map(p => <Pattern key={p} p={p} />)}</div>
      <dl className="cmd-meta">
        <div><dt>Does</dt><dd><code>{c.action}</code>{c.params && <> · {c.params}</>}</dd></div>
        {c.when && <div><dt>Only in</dt><dd>{c.when}</dd></div>}
        {c.steps && <div><dt>Steps</dt><dd><ol className="steps">{c.steps.map(s => <li key={s}><code>{s}</code></li>)}</ol></dd></div>}
      </dl>
      <p className="cmd-uses"><span className="num">{c.uses}</span> uses in the last 90 days</p>
    </SpotlightCard>
  );
}

function EditStatus({ s, ctx }) {
  const st = EDIT_STATUS[s];
  return (
    <span className={`edit-st st-${s}`}>
      {st.mark === 'overridden'
        ? <span className="ovr" aria-hidden="true">{I.minus}</span>
        : <StatusMark status={st.mark} size={16} color={ctx.accent} doneColor={ctx.dark ? '#4CC38A' : '#1E8A4C'} errorColor={ctx.dark ? '#F07A73' : '#C2362F'} />}
      {st.word}
    </span>
  );
}

function PendingEdits({ edits, ctx }) {
  return (
    <div className="card pending">
      <div className="card-head">
        <div>
          <h2 className="card-title">Edits from the web</h2>
          <p className="card-sub">Your laptop’s files are the master copy; it applies these on its next sync</p>
        </div>
      </div>
      <AnimatedList items={edits} theme={ctx.mode} accentColor={ctx.accent} frame={false} showGradients={false}
                    width="100%" maxHeight={560} gap={8} radius={10} selectOnHover={false} animation="pop"
                    renderItem={e => (
                      <div className="edit-row">
                        <div className="edit-top"><span className="edit-what">{e.what}</span><code>{e.cmd}</code></div>
                        <div className="edit-bottom"><EditStatus s={e.status} ctx={ctx} /><span className="dim">{e.when}</span></div>
                        {(e.reason || EDIT_STATUS[e.status].note) && <p className="edit-note">{e.reason || EDIT_STATUS[e.status].note}</p>}
                      </div>
                    )} />
    </div>
  );
}

/* the guided form (Doc 07): React Bits Stepper in a dialog */
function GuidedForm({ ctx, init, onClose, onSubmit }) {
  const [file, setFile] = useState(init?.file ?? 'browser');
  const [id, setId] = useState(init?.c.id ?? 'duplicate_tab');
  const [pats, setPats] = useState(init?.c.patterns.join('\n') ?? 'duplicate tab\ncopy this tab');
  const [action, setAction] = useState(init?.c.action ?? 'press_keys');
  const [params, setParams] = useState(init?.c.params ?? 'alt+d, alt+enter');
  const [test, setTest] = useState('duplicate tab');
  const list = pats.split('\n').map(s => s.trim()).filter(Boolean);
  const matches = list.some(p => new RegExp(`^${p.replace(/\{\w+\}/g, '.+')}$`, 'i').test(test.trim()));
  const ref = useRef(null);
  useEffect(() => { ref.current?.querySelector('input, select, textarea')?.focus(); const k = e => e.key === 'Escape' && onClose(); window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k); }, []);
  return (
    <div className="modal" role="dialog" aria-modal="true" aria-labelledby="gf-title" onMouseDown={e => e.target === e.currentTarget && onClose()}>
      <div className="modal-box" ref={ref}>
        <div className="modal-head">
          <h2 id="gf-title">{init ? `Edit ${init.file}.${init.c.id}` : 'Add a command'}</h2>
          <button className="icon-btn" aria-label="Close" onClick={onClose}>{I.thumbDown}</button>
        </div>
        <Stepper theme={ctx.mode} accentColor={ctx.accent} frame={false} width="100%" radius={12}
                 nextButtonText="Continue" completeButtonText="Send to laptop"
                 onFinalStepCompleted={() => onSubmit({ what: init ? 'Edit' : 'Add', cmd: `${file}.${id}` })}>
          <Step title="Where">
            <div className="gf">
              <label className="field">File<select className="input" value={file} onChange={e => setFile(e.target.value)}>{FILES.map(f => <option key={f}>{f}</option>)}</select></label>
              <label className="field">Command id<input className="input mono" value={id} onChange={e => setId(e.target.value.replace(/[^a-z0-9_]/g, ''))} /></label>
              <p className="hint">Lowercase letters, digits and _ only. It becomes <code>{file}.{id || '…'}</code>.</p>
            </div>
          </Step>
          <Step title="Say it like this">
            <div className="gf">
              <label className="field">One sentence per line<textarea className="input ta" rows={4} value={pats} onChange={e => setPats(e.target.value)} /></label>
              <p className="hint">Put a changing part in braces, like <code>{'{query}'}</code> or <code>{'{app}'}</code>.</p>
            </div>
          </Step>
          <Step title="What it does">
            <div className="gf">
              <label className="field">Action<select className="input" value={action} onChange={e => setAction(e.target.value)}>{PRIMITIVES.map(p => <option key={p}>{p}</option>)}</select></label>
              <label className="field">Details<input className="input mono" value={params} onChange={e => setParams(e.target.value)} /></label>
              <p className="hint">Only actions your laptop already has are offered, so the edit cannot run anything new.</p>
            </div>
          </Step>
          <Step title="Check">
            <div className="gf">
              <dl className="review-dl">
                <div><dt>Command</dt><dd><code>{file}.{id}</code></dd></div>
                <div><dt>Sentences</dt><dd>{list.map(p => <Pattern key={p} p={p} />)}</dd></div>
                <div><dt>Does</dt><dd><code>{action}</code> · {params}</dd></div>
              </dl>
              <label className="field">Try a sentence<input className="input" value={test} onChange={e => setTest(e.target.value)} /></label>
              <p className={`test ${matches ? 'ok' : 'no'}`}>{matches ? <>{I.ok} Matches this command</> : <>{I.q} Doesn’t match any of its sentences</>}</p>
            </div>
          </Step>
        </Stepper>
      </div>
    </div>
  );
}

function CommandsData({ ctx }) {
  const [file, setFile] = useState('core');
  const [edits, setEdits] = useState(EDITS0);
  const [form, setForm] = useState(null);
  const submit = e => {
    setForm(null);
    setEdits([{ id: `e${Date.now()}`, ...e, when: 'Just now', status: 'waiting' }, ...edits]);
    ctx.say('Sent to your laptop', `${e.what === 'Add' ? 'Adding' : 'Changing'} ${e.cmd}. It is applied and checked on the laptop’s next sync.`, { icon: I.ok });
  };
  return (
    <>
      <section className="card shelf" aria-label="Command files">
        <div className="card-head">
          <div><h2 className="card-title">Command files</h2><p className="card-sub">One file per area, read from the latest snapshot. Open one to see its commands.</p></div>
        </div>
        <div className="folders">
          {FILES.map(f => (
            <div key={f} className={`folder-slot${f === file ? ' on' : ''}`}>
              <Folder label={`${f}.yaml`} theme={ctx.mode} color={ctx.dark ? '#2A78D6' : '#5598E7'} paperColor={ctx.dark ? '#E6EBF2' : '#FFFFFF'}
                      size={0.62} open={f === file} onOpenChange={o => o && setFile(f)} intro={false} draggable={false}
                      zoomOnClick={false} peek={!ctx.reduced} tilt={ctx.reduced ? 0 : 0.5} closeOnOutsideClick={false}
                      items={LIB[f].slice(0, 3).map(c => ({ title: c.id }))} />
              <button className="folder-name" aria-pressed={f === file} onClick={() => setFile(f)}>
                <b>{f}</b><span className="num">{LIB[f].length} commands</span>
              </button>
            </div>
          ))}
        </div>
      </section>
      <section className="cmd-layout">
        <div>
          <div className="cmd-list-head">
            <h2 className="card-title"><code>{file}.yaml</code></h2>
            <span className="dim">{LIB[file].length} commands · {file === 'routines' ? 'each runs several steps' : 'in file order (earlier wins a tie)'}</span>
            <button className="btn btn-primary add-btn" onClick={() => setForm({})}>{I.plus} Add a command</button>
          </div>
          <div className="cmd-grid">
            {LIB[file].map(c => <CommandCard key={c.id} file={file} c={c} ctx={ctx} onEdit={(f, cc) => setForm({ file: f, c: cc })} />)}
          </div>
        </div>
        <PendingEdits edits={edits} ctx={ctx} />
      </section>
      {form && <GuidedForm ctx={ctx} init={form.c ? form : null} onClose={() => setForm(null)} onSubmit={submit} />}
    </>
  );
}

function CommandsLoading({ ctx }) {
  return (
    <>
      <section className="card shelf"><div className="card-head"><div><h2 className="card-title">Command files</h2><LoadingNote what="your command files" mode={ctx.mode} /></div></div>
        <div className="folders">{FILES.map(f => <div key={f} className="folder-slot"><Skel w={139} h={110} r={10} /><Skel w={90} /></div>)}</div>
      </section>
      <section className="cmd-layout"><div className="cmd-grid">{[0, 1, 2, 3].map(i => <div key={i} className="card cmd-card skel-card"><Skel w={120} /><Skel w="80%" h={24} /><Skel w="60%" h={24} /><Skel w="50%" /></div>)}</div>
        <div className="card pending skel-card"><Skel w={160} /><Skel w="90%" h={50} /><Skel w="90%" h={50} /></div></section>
    </>
  );
}

function Commands(ctx) {
  const { state } = ctx;
  return (
    <>
      <PageHead title="Commands" art={<h2 className="phead-h">Commands</h2>}
                sub={state === 'data' ? 'Everything you can say, from the laptop’s command files (snapshot from 3 minutes ago).' : 'Everything you can say, from the laptop’s command files.'} />
      {state === 'data' && <CommandsData ctx={ctx} />}
      {state === 'loading' && <CommandsLoading ctx={ctx} />}
      {state === 'waking' && <WakingPanel ctx={ctx} since={ctx.review.since} what="Your commands" />}
      {state === 'error' && <ErrorPanel ctx={ctx} what="your command files" endpoint="GET /v1/library" />}
      {state === 'empty' && (
        <EmptyPanel ctx={ctx} title="No command files yet"
          body="The laptop uploads a snapshot of its command files on its first sync. Until then there is nothing to show or edit here; the commands themselves already work on the laptop."
          action={<button className="btn btn-primary" onClick={() => goPage('devices', ctx.choice)}>{I.devices} Connect your laptop</button>}>
          <div className="empty-folders" aria-hidden="true">
            <Folder label="core.yaml" theme={ctx.mode} color={ctx.dark ? '#33404F' : '#C9CED8'} size={0.9} intro={!ctx.reduced}
                    draggable={false} zoomOnClick={false} items={[]} />
          </div>
        </EmptyPanel>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Shell page="commands" render={ctx => <Commands {...ctx} />} />);

</script>
</body>
</html>
