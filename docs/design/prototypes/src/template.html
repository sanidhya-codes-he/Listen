<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ---- tokens: Direction A (light) and Direction B (dark) ---- */
:root {
  color-scheme: light;
  --bg: #F5F6F8; --surface: #FFFFFF; --surface-2: #EEF0F3; --border: #E1E4EA;
  --ink: #1D2330; --ink-2: #4E5668; --ink-3: #6B7385;
  --accent: #2A78D6; --on-accent: #FFFFFF;
  --good: #1E8A4C; --warn: #A86400; --bad: #C2362F;
  --font: 'Instrument Sans', system-ui, sans-serif;
  --font-num: 'Instrument Sans', system-ui, sans-serif;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #131A22; --surface: #18212B; --surface-2: #1F2935; --border: #2A3440;
    --ink: #E6EBF2; --ink-2: #A9B4C3; --ink-3: #8592A3;
    --accent: #5598E7; --on-accent: #0B1118;
    --good: #4CC38A; --warn: #E5A23A; --bad: #F07A73;
    --font: 'IBM Plex Sans', system-ui, sans-serif;
    --font-num: 'IBM Plex Mono', ui-monospace, monospace;
    --radius: 8px;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #131A22; --surface: #18212B; --surface-2: #1F2935; --border: #2A3440;
  --ink: #E6EBF2; --ink-2: #A9B4C3; --ink-3: #8592A3;
  --accent: #5598E7; --on-accent: #0B1118;
  --good: #4CC38A; --warn: #E5A23A; --bad: #F07A73;
  --font: 'IBM Plex Sans', system-ui, sans-serif;
  --font-num: 'IBM Plex Mono', ui-monospace, monospace;
  --radius: 8px;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.45; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.page { max-width: 1360px; margin: 0 auto; padding: 20px 40px 150px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 40px; }
.date { color: var(--ink-2); }
.topbar-right { display: flex; align-items: center; gap: 12px; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--ink-2); font-size: 13px; }
.pill svg { color: var(--good); }
.seg { display: inline-flex; padding: 3px; gap: 2px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); }
.seg button { border: 0; background: none; padding: 5px 12px; min-height: 32px; border-radius: 999px; cursor: pointer; color: var(--ink-2); font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); font-weight: 600; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 18px 24px 0; }
.card-title { margin: 0; font-size: 15px; font-weight: 600; }
.card-sub { margin: 2px 0 0; color: var(--ink-2); font-size: 13px; }
.link { border: 0; background: none; padding: 4px 0; color: var(--accent); cursor: pointer; font-weight: 500; }

/* ---- React Bits CSS (official, unchanged) ---- */
/*__RBCSS__*/

/* ---- shared shell ---- */
/*__SHAREDCSS__*/

/* ---- page ---- */
/*__PAGECSS__*/


/* ---- Dock re-themed to the page tokens (overrides the Dock's built-in grey theme;
        !important is needed because the Dock sets its variables as inline styles) ---- */
.dock-strip .dock {
  --dock-panel: color-mix(in srgb, var(--surface) 82%, transparent) !important;
  --dock-panel-edge: var(--border) !important;
  --dock-panel-highlight: transparent !important;
  --dock-panel-shadow: 0 18px 40px -20px rgb(0 0 0 / 0.35) !important;
  --dock-tile: var(--surface-2) !important;
  --dock-tile-edge: var(--border) !important;
  --dock-tile-highlight: transparent !important;
  --dock-tile-shadow: none !important;
  --dock-ink: var(--ink-2) !important;
  --dock-label: var(--surface) !important;
  --dock-label-ink: var(--ink) !important;
  --dock-dot: var(--accent) !important;
  --dock-separator: var(--border) !important;
  --dock-accent: var(--accent) !important;
}
.dock-strip .dock-label { font-family: var(--font); }
/* the current page's tile wears the accent, like the selected pill elsewhere */
.dock-strip .dock-item:has(.dock-dot) .dock-face {
  background: color-mix(in srgb, var(--accent) 14%, var(--surface));
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent);
  color: var(--accent);
}
.dock-strip .dock-item:hover .dock-face { color: var(--ink); }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>

</html>
