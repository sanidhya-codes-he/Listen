    const duration = reduceRef.current ? 100 : 150;
    let done = false;
    const finish = () => {
      if (done || !aliveRef.current) return;
      done = true;
      callbacks.current.onExited?.();
    };
    if (outer && !reduceRef.current) {
      outer.animate([{ transform: 'scale(1)' }, { transform: 'scale(0.96)' }], {
        duration,
        easing: 'ease-in',
        fill: 'forwards'
      });
    }
    layers.forEach(layer =>
      layer.animate([{ opacity: 1 }, { opacity: 0 }], { duration, easing: 'ease-in', fill: 'forwards' })
    );
    const timer = window.setTimeout(finish, duration);
    return () => window.clearTimeout(timer);
  }, [closing]);

  useIsomorphicLayoutEffect(() => {
    const highlight = highlightRef.current;
    if (!highlight) return;
    const row = rowRefs.current[active];
    if (!row || blink) {
      if (blink) highlight.style.transition = 'none';
      highlight.style.opacity = '0';
      return;
    }
    const jump = highlight.style.opacity !== '1' || reduceRef.current;
    if (jump) highlight.style.transition = 'none';
    highlight.style.transform = `translateY(${row.offsetTop}px)`;
    highlight.style.height = `${row.offsetHeight}px`;
    highlight.style.opacity = '1';
    if (jump) {
      void highlight.offsetHeight;
      highlight.style.transition = '';
    }
  }, [active, blink]);

  const activate = index => {
    setActive(index);
    rowRefs.current[index]?.focus({ preventScroll: true });
  };

  const openSub = (index, keyboard) => {
    window.clearTimeout(timerRef.current);
    const frame = frameRef.current;
    const row = rowRefs.current[index];
    if (!frame || !row) return;
    setSub({
      index,
      keyboard,
      edge: { left: frame.left, right: frame.left + frame.width, top: frame.top + row.offsetTop }
    });
  };

  const closeSub = () => {
    window.clearTimeout(timerRef.current);
    setSub(null);
  };

  const choose = (index, keyboard) => {
    if (chosen) return;
    const row = rows[index];
    setChosen(true);
    setActive(index);
    window.clearTimeout(timerRef.current);
    if (reduceRef.current) {
      callbacks.current.onSelect?.(row, keyboard);
      return;
    }
    setBlink(true);
    window.setTimeout(() => aliveRef.current && setBlink(false), 70);
    window.setTimeout(() => aliveRef.current && callbacks.current.onSelect?.(row, keyboard), 150);
  };

  const enterRow = index => {
    if (chosen || active === index || !usable(rows[index])) return;
    activate(index);
    window.clearTimeout(timerRef.current);
    if (rows[index].items?.length) {
      if (sub?.index !== index) timerRef.current = window.setTimeout(() => openSub(index, false), 120);
    } else if (sub) {
      timerRef.current = window.setTimeout(closeSub, 220);
    }
  };

  const onKeyDown = event => {
    if (chosen) return;
    const { key } = event;
    const order = rows.flatMap((row, i) => (usable(row) ? [i] : []));
    let handled = true;
    if (key === 'ArrowDown' || key === 'ArrowUp' || key === 'Home' || key === 'End') {
      if (order.length) {
        const at = order.indexOf(active);
        let next = order[0];
        if (key === 'End') next = order[order.length - 1];
        else if (key === 'ArrowDown') next = order[(at + 1) % order.length];
        else if (key === 'ArrowUp') next = order[at <= 0 ? order.length - 1 : at - 1];
        if (sub) closeSub();
        activate(next);
      }
    } else if (key === 'ArrowRight' && rows[active]?.items?.length) {
      openSub(active, true);
    } else if ((key === 'ArrowLeft' || key === 'Escape') && nested) {
      callbacks.current.onBack?.();
    } else if (key === 'Escape' || key === 'Tab') {
      callbacks.current.onDismiss?.(true);
    } else {
      handled = false;
    }
    if (handled) {
      event.preventDefault();
      event.stopPropagation();
    }
  };

  const subRow = sub ? rows[sub.index] : null;

  return (
    <>
      {createPortal(
        <div ref={outerRef} className="dock-menu" style={tokens} data-dock-menu="">
          <span className="dock-menu-shadow" />
          <span ref={glassRef} className="dock-menu-glass" />
          <svg ref={shapeRef} className="dock-menu-shape" aria-hidden="true">
            <path ref={pathRef} />
          </svg>
          <div
            ref={listRef}
            className="dock-menu-list"
            role="menu"
            aria-label={label}
            tabIndex={-1}
            onKeyDown={onKeyDown}
            onPointerEnter={() => onEnter?.()}
            onPointerLeave={() => {
              if (sub || chosen) return;
              setActive(-1);
              listRef.current?.focus({ preventScroll: true });
            }}
          >
            <span ref={highlightRef} className="dock-menu-highlight" />
            {rows.map((row, index) => {
              if (!row) return null;
              if (row.separator) return <span key={index} className="dock-menu-separator" role="separator" />;
              const lit = index === active && !blink;
              const submenu = Boolean(row.items?.length);
              return (
                <button
                  key={index}
                  ref={node => {
                    rowRefs.current[index] = node;
                  }}
                  type="button"
                  className="dock-menu-row"
                  role={row.checked !== undefined ? 'menuitemcheckbox' : 'menuitem'}
                  aria-checked={row.checked !== undefined ? Boolean(row.checked) : undefined}
                  aria-disabled={row.disabled ? true : undefined}
                  aria-haspopup={submenu ? 'menu' : undefined}
                  aria-expanded={submenu ? sub?.index === index : undefined}
                  tabIndex={-1}
                  data-dock-row={index}
                  data-active={lit ? '' : undefined}
                  onPointerMove={() => enterRow(index)}
                  onPointerUp={() => {
                    if (!pressingRef?.current || !usable(row) || submenu) return;
                    pressingRef.current = false;
                    choose(index, false);
                  }}
                  onClick={event => {
                    if (chosen || !usable(row)) return;
                    if (submenu) openSub(index, event.detail === 0);
                    else choose(index, event.detail === 0);
                  }}
                >
                  {checks ? <span className="dock-menu-check">{row.checked ? <CheckGlyph /> : null}</span> : null}
                  {row.icon ? <span className="dock-menu-icon">{row.icon}</span> : null}
                  <span className="dock-menu-text">{row.label}</span>
                  {row.shortcut ? <span className="dock-menu-shortcut">{row.shortcut}</span> : null}
                  {submenu ? (
                    <span className="dock-menu-chevron">
                      <ChevronGlyph />
                    </span>
                  ) : null}
                </button>
              );
            })}
          </div>
        </div>,
        document.body
      )}
      {sub ? (
        <DockMenu
          key={sub.index}
          rows={subRow?.items ?? []}
          label={typeof subRow?.label === 'string' ? subRow.label : undefined}
          edge={sub.edge}
          tokens={tokens}
          nested
          focusFirst={sub.keyboard}
          closing={closing}
          pressingRef={pressingRef}
          onSelect={(row, keyboard) => callbacks.current.onSelect?.(row, keyboard)}
          onDismiss={restore => callbacks.current.onDismiss?.(restore)}
          onBack={() => {
            const index = sub.index;
            closeSub();
            activate(index);
          }}
          onEnter={() => {
            window.clearTimeout(timerRef.current);
            setActive(sub.index);
          }}
        />
      ) : null}
    </>
  );
}

function Dock({
  items = [],
  position = 'bottom',
  theme = 'dark',
  baseItemSize = 50,
  magnification = 70,
  distance = 200,
  panelHeight = 68,
  gap = 10,
  roundness = 0.5,
  spring = { mass: 0.1, stiffness: 150, damping: 12 },
  bounce = true,
  autoHide = false,
  tiles = true,
  showLabels = true,
  showIndicators = true,
  showBadges = true,
  badgeColor = '#ff453a',
  accentColor = '#0a84ff',
  className = '',
  style
}) {
  const rootRef = useRef(null);
  const itemRefs = useRef([]);
  const wakeRef = useRef(null);
  const actionsRef = useRef(null);
  const menuRef = useRef(null);
  const serialRef = useRef(0);
  const pressRef = useRef(null);
  const pressingRef = useRef(false);
  const skipRef = useRef(-1);
  const [fit, setFit] = useState(1);
  const [menu, setMenu] = useState(null);
  const side = SIDES.includes(position) ? position : 'bottom';
  const vertical = side === 'left' || side === 'right';
  const rawBase = Math.max(16, baseItemSize);
  const rawPeak = Math.max(rawBase, magnification);
  const rawThickness = Math.max(rawBase, panelHeight);
  const rawGap = Math.max(0, gap);
  const length =
    items.reduce((sum, item) => sum + (item?.separator ? 1 : rawBase), 0) +
    rawGap * Math.max(0, items.length - 1) +
    rawThickness -
    rawBase;
  const base = rawBase * fit;
  const peak = rawPeak * fit;
  const thickness = rawThickness * fit;
  const tokens = { ...(THEMES[theme] ?? THEMES.dark), '--dock-accent': accentColor, '--dock-badge': badgeColor };

  const settings = {
    items,
    side,
    vertical,
    length: length + rawPeak - rawBase,
    base,
    peak,
    thickness,
    gap: rawGap * fit,
    distance: Math.max(1, distance) * fit,
    mass: Math.max(0.01, spring?.mass ?? 0.1),
    stiffness: Math.max(1, spring?.stiffness ?? 150),
    damping: Math.max(0, spring?.damping ?? 12),
    bounce,
    autoHide
  };
  const settingsRef = useRef(settings);
  settingsRef.current = settings;
  menuRef.current = menu;

  useEffect(() => {
    wakeRef.current?.();
  });

  useIsomorphicLayoutEffect(() => {
    if (autoHide) rootRef.current?.setAttribute('data-hidden', '');
  }, []);

  useIsomorphicLayoutEffect(() => {
    const root = rootRef.current;
    if (!root) return undefined;
    const host = root.offsetParent ?? document.documentElement;
    const measure = () => {
      const s = settingsRef.current;
      const room = (s.vertical ? host.clientHeight : host.clientWidth) - EDGE * 2;
      const next = s.length > 0 ? Math.min(1, Math.max(0.4, room / s.length)) : 1;
      setFit(Math.round(next * 1000) / 1000);
    };
    measure();
    const observer = new ResizeObserver(measure);
    observer.observe(host);
    return () => observer.disconnect();
  }, [length, vertical, rawPeak, rawBase]);

  useEffect(() => {
    const root = rootRef.current;
    if (!root) return undefined;

    const reduce = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches ?? false;
    const motion = new Map();
    const pointer = { x: 0, y: 0, inside: false };
    let focused = -1;
    let held = null;
    let lastFocus = null;
    let lastRest = [];
    let lastBase = settingsRef.current.base;
    let hidden = root.hasAttribute('data-hidden');
    let hiding = settingsRef.current.autoHide;
    let hideTimer = 0;
    let raf = 0;
    let last = 0;
    let alive = true;

    const entry = index => {
      let state = motion.get(index);
      if (!state) {
        state = {
          size: settingsRef.current.base,
          velocity: 0,
          lift: 0,
          rise: 0,
          launch: 0,
          gravity: 0,
          hopping: false,
          drawn: '',
          node: null
        };
        motion.set(index, state);
      }
      return state;
    };

    const tick = now => {
      raf = 0;
      if (!alive) return;
      const s = settingsRef.current;
      const dt = Math.min(1 / 30, Math.max(0.001, (now - last) / 1000));
      last = now;
      if (s.base !== lastBase) {
        const ratio = s.base / lastBase;
        motion.forEach(state => {
          state.size *= ratio;
          state.velocity *= ratio;
        });
        lastBase = s.base;
      }
      const rect = root.getBoundingClientRect();
      const center = s.vertical ? rect.top + rect.height / 2 : rect.left + rect.width / 2;
      const spans = s.items.map(item => (item?.separator ? 1 : s.base));
      let cursor = -(spans.reduce((sum, span) => sum + span, 0) + s.gap * Math.max(0, spans.length - 1)) / 2;
      const rest = spans.map(span => {
        const middle = cursor + span / 2;
        cursor += span + s.gap;
        return middle;
      });
      let focus = null;
      if (held !== null) focus = held;
      else if (pointer.inside) focus = (s.vertical ? pointer.y : pointer.x) - center;
      else if (rest[focused] !== undefined) focus = rest[focused];
      lastFocus = focus;
      lastRest = rest;
      const steps = Math.max(1, Math.ceil(dt * 240));
      const h = dt / steps;
      const k = s.stiffness / s.mass;
      const c = s.damping / s.mass;
      let moving = false;

      s.items.forEach((item, index) => {
        const node = itemRefs.current[index];
        if (!node || item?.separator) return;
        const state = entry(index);
        const reach = focus === null ? 1 : Math.abs(focus - rest[index]) / s.distance;
        const target = s.base + (s.peak - s.base) * (reach < 1 ? Math.cos((reach * Math.PI) / 2) ** 2 : 0);
        if (reduce) {
          state.size = target;
          state.velocity = 0;
        } else {
          for (let i = 0; i < steps; i++) {
            state.velocity = (state.velocity + h * k * (target - state.size)) / (1 + h * c + h * h * k);
            state.size += state.velocity * h;
            if (!state.hopping) continue;
            state.rise -= state.gravity * h;
            state.lift += state.rise * h;
            if (state.lift > 0) continue;
            state.lift = 0;
            state.rise *= -0.36;
            if (state.rise < state.launch * 0.2) {
              state.rise = 0;
              state.hopping = false;
              node.removeAttribute('data-hop');
            }
          }
        }
        if (Math.abs(state.velocity) < 0.01 && Math.abs(target - state.size) < 0.01) {
          state.size = target;
          state.velocity = 0;
        } else {
          moving = true;
        }
        if (state.hopping) moving = true;
        const size = Math.max(1, state.size);
        const drawn = `${size.toFixed(2)} ${state.lift.toFixed(2)} ${s.side}`;
        if (drawn === state.drawn && node === state.node) return;
        state.drawn = drawn;
        state.node = node;
        const lift = s.side === 'bottom' || s.side === 'right' ? -state.lift : state.lift;
        const tile = node.firstElementChild;
        node.style.width = `${size}px`;
        node.style.height = `${size}px`;
        if (tile)
          tile.style.transform = `translate(${s.vertical ? `${lift}px, 0` : `0, ${lift}px`}) scale(${size / s.base})`;
      });

      if (moving) raf = requestAnimationFrame(tick);
    };

    const wake = () => {
      if (raf || !alive) return;
      last = performance.now();
      raf = requestAnimationFrame(tick);
    };

    const show = () => {
      window.clearTimeout(hideTimer);
      hideTimer = 0;
      if (!hidden) return;
      hidden = false;
      root.removeAttribute('data-hidden');
    };

    const hide = () => {
      window.clearTimeout(hideTimer);
      hideTimer = 0;
      const blocked = pointer.inside || held !== null || root.contains(document.activeElement);
      if (hidden || !settingsRef.current.autoHide || blocked) return;
      hidden = true;
      root.setAttribute('data-hidden', '');
    };

    const hideLater = () => {
      if (hidden || hideTimer || !settingsRef.current.autoHide) return;
      hideTimer = window.setTimeout(hide, 600);
    };

    wakeRef.current = () => {
      const enabled = settingsRef.current.autoHide;
      if (enabled !== hiding) {
        hiding = enabled;
        if (enabled) hide();
        else show();
      }
      wake();
    };

    actionsRef.current = {
      hop: index => {
        const node = itemRefs.current[index];
        if (reduce || !settingsRef.current.bounce || !node) return;
        const state = entry(index);
        if (state.hopping) return;
        const height = state.size * HOP;
        state.gravity = (8 * height) / (HOP_TIME * HOP_TIME);
        state.launch = (state.gravity * HOP_TIME) / 2;
        state.rise = state.launch;
        state.hopping = true;
        node.setAttribute('data-hop', '');
        wake();
      },
      focus: index => {
        focused = index;
        wake();
      },
      hold: index => {
        if (index === null) {
          held = null;
          wake();
          hideLater();
          return;
        }
        held = lastFocus ?? lastRest[index] ?? 0;
        show();
        wake();
      }
    };

    const onMove = event => {
      pointer.x = event.clientX;
      pointer.y = event.clientY;
      pointer.inside = true;
      show();
      wake();
    };
    const onLeave = () => {
      pointer.inside = false;
      wake();
      hideLater();
    };
    const onFocusOut = event => {
      if (!root.contains(event.relatedTarget)) hideLater();
    };
    const onWindowMove = event => {
      const s = settingsRef.current;
      if (!s.autoHide || pointer.inside) return;
      const host = root.offsetParent;
      const rect = host
        ? host.getBoundingClientRect()
        : { left: 0, top: 0, right: window.innerWidth, bottom: window.innerHeight };
      const zone = EDGE + s.thickness * 0.6;
      const x = event.clientX;
      const y = event.clientY;
      const within = x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
      const near = {
        bottom: y >= rect.bottom - zone,
        top: y <= rect.top + zone,
        left: x <= rect.left + zone,
        right: x >= rect.right - zone
      }[s.side];
      if (within && near) show();
      else hideLater();
    };

    root.addEventListener('pointermove', onMove);
    root.addEventListener('pointerdown', onMove);
    root.addEventListener('pointerleave', onLeave);
    root.addEventListener('pointercancel', onLeave);
    root.addEventListener('focusin', show);
    root.addEventListener('focusout', onFocusOut);
    window.addEventListener('pointermove', onWindowMove);
    window.addEventListener('pointerdown', onWindowMove);
    wake();

    return () => {
      alive = false;
      cancelAnimationFrame(raf);
      window.clearTimeout(hideTimer);
      root.removeEventListener('pointermove', onMove);
      root.removeEventListener('pointerdown', onMove);
      root.removeEventListener('pointerleave', onLeave);
      root.removeEventListener('pointercancel', onLeave);
      root.removeEventListener('focusin', show);
      root.removeEventListener('focusout', onFocusOut);
      window.removeEventListener('pointermove', onWindowMove);
      window.removeEventListener('pointerdown', onWindowMove);
      wakeRef.current = null;
      actionsRef.current = null;
      const press = pressRef.current;
      if (press) {
        window.clearTimeout(press.timer);
        press.cleanup();
      }
    };
  }, []);

  const closeMenu = useCallback(restore => {
    const current = menuRef.current;
    if (!current || current.closing) return;
    const rows = settingsRef.current.items[current.index]?.menu ?? [];
    const next = { ...current, closing: true, restore, rows };
    menuRef.current = next;
    setMenu(next);
  }, []);

  const finishMenu = useCallback(() => {
    const current = menuRef.current;
    menuRef.current = null;
    setMenu(null);
    actionsRef.current?.hold(null);
    if (current?.restore) itemRefs.current[current.index]?.focus({ preventScroll: true });
  }, []);

  useEffect(() => {
    if (!menu || menu.closing) return undefined;
    const owner = itemRefs.current[menu.index];
    const onDown = event => {
      const target = event.target;
      if (target instanceof Element && (target.closest('[data-dock-menu]') || owner?.contains(target))) return;
      closeMenu(false);
    };
    const onScroll = event => {
      if (event.target instanceof Element && event.target.closest('[data-dock-menu]')) return;
      closeMenu(false);
    };
    const onAway = () => closeMenu(false);
    document.addEventListener('pointerdown', onDown, true);
    window.addEventListener('scroll', onScroll, true);
    window.addEventListener('resize', onAway);
    window.addEventListener('blur', onAway);
    return () => {
      document.removeEventListener('pointerdown', onDown, true);
      window.removeEventListener('scroll', onScroll, true);
      window.removeEventListener('resize', onAway);
      window.removeEventListener('blur', onAway);
    };
  }, [menu, closeMenu]);

  const openMenu = (index, mode) => {
    const node = itemRefs.current[index];
    if (!node || !items[index]?.menu?.length) return false;
    const current = menuRef.current;
    if (current && current.index === index && !current.closing) return true;
    actionsRef.current?.hold(index);
    const rect = node.getBoundingClientRect();
    const point = {
      bottom: { x: rect.left + rect.width / 2, y: rect.top - MENU_GAP },
      top: { x: rect.left + rect.width / 2, y: rect.bottom + MENU_GAP },
      left: { x: rect.right + MENU_GAP, y: rect.top + rect.height / 2 },
      right: { x: rect.left - MENU_GAP, y: rect.top + rect.height / 2 }
    }[side];
    serialRef.current += 1;
    const next = {
      id: serialRef.current,
      index,
      point,
      keyboard: mode === 'keyboard',
      closing: false,
      restore: false
    };
    menuRef.current = next;
    setMenu(next);
    return true;
  };

  const endPress = () => {
    const press = pressRef.current;
    if (!press) return;
    window.clearTimeout(press.timer);
    press.cleanup();
    pressRef.current = null;
  };

  const startPress = (event, index) => {
    endPress();
    const target = event.currentTarget;
    const press = { id: event.pointerId, x: event.clientX, y: event.clientY, timer: 0, cleanup: () => {} };
    if (target.hasPointerCapture?.(event.pointerId)) target.releasePointerCapture(event.pointerId);
    const onMove = moved => {
      if (moved.pointerId !== press.id) return;
      if (Math.hypot(moved.clientX - press.x, moved.clientY - press.y) > 8) endPress();
    };
    const onUp = released => {
      if (released.pointerId === press.id) endPress();
    };
    press.cleanup = () => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onUp);
    };
    press.timer = window.setTimeout(() => {
      press.cleanup();
      pressRef.current = null;
      if (!openMenu(index, 'press')) return;
      skipRef.current = index;
      pressingRef.current = true;
      window.addEventListener(
        'pointerup',
        () => {
          pressingRef.current = false;
        },
        { once: true }
      );
    }, HOLD_TIME);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
    pressRef.current = press;
  };

  const onItemKeyDown = (event, index) => {
    const toward = { bottom: 'ArrowUp', top: 'ArrowDown', left: 'ArrowRight', right: 'ArrowLeft' }[side];
    if (event.key === 'ContextMenu' || (event.shiftKey && event.key === 'F10') || event.key === toward) {
      if (openMenu(index, 'keyboard')) event.preventDefault();
      return;
    }
    const order = items.flatMap((item, i) => (item?.separator ? [] : [i]));
    const at = order.indexOf(index);
    const keys = vertical ? ['ArrowUp', 'ArrowDown'] : ['ArrowLeft', 'ArrowRight'];
    let next;
    if (event.key === keys[0]) next = order[(at - 1 + order.length) % order.length];
    else if (event.key === keys[1]) next = order[(at + 1) % order.length];
    else if (event.key === 'Home') next = order[0];
    else if (event.key === 'End') next = order[order.length - 1];
    if (next === undefined) return;
    event.preventDefault();
    itemRefs.current[next]?.focus();
  };

  const openIndex = menu && !menu.closing ? menu.index : -1;

  return (
    <div
      ref={rootRef}
      className={`dock dock--${side}${tiles ? '' : ' dock--bare'}${className ? ` ${className}` : ''}`}
      role="toolbar"
      aria-label="Dock"
      aria-orientation={vertical ? 'vertical' : 'horizontal'}
      style={{
        ...tokens,
        '--dock-base': `${base}px`,
        '--dock-thickness': `${thickness}px`,
        '--dock-gap': `${rawGap * fit}px`,
        '--dock-pad': `${(thickness - base) / 2}px`,
        '--dock-reach': `${peak - base}px`,
        '--dock-round': clamp(roundness, 0, 1),
        ...style
      }}
    >
      {items.map((item, index) =>
        item?.separator ? (
          <span key={index} className="dock-separator" aria-hidden="true" />
        ) : (
          <button
            key={index}
            ref={node => {
              itemRefs.current[index] = node;
            }}
            type="button"
            className={`dock-item${item.className ? ` ${item.className}` : ''}`}
            aria-label={item.label}
            aria-haspopup={item.menu?.length ? 'menu' : undefined}
            aria-expanded={item.menu?.length ? openIndex === index : undefined}
            data-open={openIndex === index ? '' : undefined}
            onPointerDown={event => {
              skipRef.current = -1;
              const current = menuRef.current;
              if (current && !current.closing) {
                if (event.button === 2 || event.ctrlKey) return;
                skipRef.current = index;
                closeMenu(false);
                return;
              }
              if (item.menu?.length && event.button === 0 && !event.ctrlKey) startPress(event, index);
            }}
            onContextMenu={event => {
              if (!item.menu?.length) return;
              event.preventDefault();
              endPress();
              openMenu(index, 'pointer');
            }}
            onClick={() => {
              if (skipRef.current === index) {
                skipRef.current = -1;
                return;
              }
              actionsRef.current?.hop(index);
              item.onClick?.();
            }}
            onFocus={event => {
              if (event.currentTarget.matches(':focus-visible')) actionsRef.current?.focus(index);
            }}
            onBlur={() => actionsRef.current?.focus(-1)}
            onKeyDown={event => onItemKeyDown(event, index)}
          >
            <span className="dock-tile">
              <span className="dock-face">{item.icon}</span>
              {showBadges && hasBadge(item.badge) ? (
                <span className="dock-badge">{item.badge === true ? null : item.badge}</span>
              ) : null}
            </span>
            {showIndicators && item.active ? <span className="dock-dot" aria-hidden="true" /> : null}
            {showLabels && item.label && !menu ? (
              <span className="dock-label" aria-hidden="true">
                {item.label}
              </span>
            ) : null}
          </button>
        )
      )}
      {menu ? (
        <DockMenu
          key={menu.id}
          rows={menu.rows ?? items[menu.index]?.menu ?? []}
          label={items[menu.index]?.label}
          side={side}
          point={menu.point}
          tokens={tokens}
          focusFirst={menu.keyboard}
          closing={menu.closing}
          pressingRef={pressingRef}
          onSelect={(row, keyboard) => {
            closeMenu(keyboard || Boolean(menuRef.current?.keyboard));
            row.onClick?.();
          }}
          onDismiss={closeMenu}
          onExited={finishMenu}
        />
      ) : null}
    </div>
  );
}

return Dock;
})();

/* ---- LatticeLoader: React Bits (official source) ---- */
const LatticeLoader = (() => {
const { useEffect, useLayoutEffect, useRef, useState } = React;


const PATTERNS = {
  arrow: { 3: { cells: [1, 2, 3, 0, 1, 2, 1, 2, 3], loop: 7.2, scale: 1 } },
  dots: { 3: { cells: [0, 1, 2, 0, 1, 2, 0, 1, 2], loop: 3, scale: 2.4 } },
  ripple: { 3: { cells: [2, 1, 2, 1, 0, 1, 2, 1, 2], loop: 4.8, scale: 1.5 } },
  spiral: { 3: { cells: [0, 1, 2, 7, 8, 3, 6, 5, 4], loop: 9, scale: 1.2, lit: 0.35 } },
  orbit: {
    3: { cells: [0, 1, 2, 7, null, 3, 6, 5, 4], loop: 8, scale: 1.2 },
    4: { cells: [0, 1, 2, 3, 11, null, null, 4, 10, null, null, 5, 9, 8, 7, 6], loop: 6, scale: 1.2, lit: 0.45 }
  },
  snake: {
    3: { cells: [0, 1, 2, 5, 4, 3, 6, 7, 8], loop: 9, scale: 1, lit: 0.35 },
    4: { cells: [0, 1, 2, 3, 7, 6, 5, 4, 8, 9, 10, 11, 15, 14, 13, 12], loop: 16, scale: 1, lit: 0.25 }
  },
  sweep: { 4: { cells: [0, 1, 2, 3, 1, 2, 3, 4, 2, 3, 4, 5, 3, 4, 5, 6], loop: 5, scale: 1, lit: 0.45 } },
  spin: { 4: { cells: [0, 0, 1, 1, 0, 0, 1, 1, 3, 3, 2, 2, 3, 3, 2, 2], loop: 4, scale: 1.6, lit: 0.35 } },
  rain: { 4: { cells: [0, 2, 1, 3, 1, 3, 2, 4, 2, 4, 3, 5, 3, 5, 4, 6], loop: 4, scale: 1.2, lit: 0.35 } },
  pulse: { 4: { cells: [2, 1, 1, 2, 1, 0, 0, 1, 1, 0, 0, 1, 2, 1, 1, 2], loop: 2.4, scale: 2.5, lit: 0.45 } }
};
const DEFAULT_PATTERN = { 3: 'orbit', 4: 'sweep' };
const MARKS = {
  3: { done: [2, 3, 5, 7], error: [0, 2, 4, 6, 8] },
  4: { done: [7, 8, 10, 13], error: [0, 3, 5, 6, 9, 10, 12, 15] }
};

const resolvePattern = (pattern, grid) => {
  if (typeof pattern === 'string') {
    const named = PATTERNS[pattern];
    return (named && named[grid]) || PATTERNS[DEFAULT_PATTERN[grid]][grid];
  }
  const cells = Array.from({ length: grid * grid }, (_, i) => pattern.cells[i] ?? null);
  const max = Math.max(0, ...cells.filter(v => v != null));
  return { cells, loop: pattern.loop ?? max + 4.2, scale: pattern.scale ?? 1, lit: pattern.lit ?? 0.62 };
};
const fmt = ds => (ds < 600 ? `${(ds / 10).toFixed(1)}s` : `${Math.floor(ds / 600)}m ${((ds % 600) / 10).toFixed(1)}s`);
const spoken = ds =>
  ds < 600
    ? `${(ds / 10).toFixed(1)} seconds`
    : `${Math.floor(ds / 600)} minutes ${((ds % 600) / 10).toFixed(1)} seconds`;

function LatticeLoader({
  label = 'Thinking',
  doneLabel = 'Done in',
  errorLabel = 'Failed after',
  status = 'working',
  pattern = 'orbit',
  grid = 3,
  shape = 'round',
  color = 'currentColor',
  doneColor = '#22c55e',
  errorColor = '#ef4444',
  cellSize = 6,
  gap = 2,
  fontSize = 14,
  step = 90,
  idleOpacity = 0.15,
  glow = false,
  glowColor = '',
  showTimer = true,
  elapsed,
  className = '',
  style
}) {
  const n = grid === 4 ? 4 : 3;
  const pat = resolvePattern(pattern, n);
  const marks = MARKS[n];
  const d = step * pat.scale;
  const cycle = Math.round(pat.loop * d);

  const timerRef = useRef(null);
  const dsRef = useRef(0);
  const markRef = useRef('done');
  const mark = status === 'working' ? markRef.current : status;
  markRef.current = mark;
  const [announce, setAnnounce] = useState(`${label}, in progress`);

  const paint = ds => {
    dsRef.current = ds;
    if (timerRef.current) timerRef.current.textContent = fmt(ds);
  };

  useLayoutEffect(() => {
    if (elapsed != null) {
      paint(Math.round(elapsed * 10));
      return undefined;
    }
    if (status !== 'working') return undefined;
    const startedAt = performance.now();
    paint(0);
    const id = setInterval(() => paint(Math.floor((performance.now() - startedAt) / 100)), 100);
    return () => clearInterval(id);
  }, [status, elapsed]);

  useEffect(() => {
    if (status === 'working') setAnnounce(`${label}, in progress`);
    else setAnnounce(`${status === 'done' ? doneLabel : errorLabel}${showTimer ? ` ${spoken(dsRef.current)}` : ''}`);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [status]);

  return (
    <span
      role="status"
      className={`lattice-loader${className ? ` ${className}` : ''}`}
      data-status={status}
      data-shape={shape}
      data-glow={glow ? '' : undefined}
      style={{
        '--ll-n': n,
        '--ll-cell': `${cellSize}px`,
        '--ll-gap': `${gap}px`,
        '--ll-font': `${fontSize}px`,
        '--ll-color': color,
        '--ll-mark': status === 'error' ? errorColor : doneColor,
        '--ll-idle': idleOpacity,
        '--ll-glow': glowColor || color,
        '--ll-mark-glow': glowColor || (status === 'error' ? errorColor : doneColor),
        '--ll-cycle': `${cycle}ms`,
        ...style
      }}
    >
      <span className="lattice-loader__grid" aria-hidden="true">
        <span className="lattice-loader__layer lattice-loader__run">
          {pat.cells.map((unit, i) => (
            <span
              key={i}
              className="lattice-loader__cell"
              data-hole={unit == null ? '' : undefined}
              data-lit={pat.lit && pat.lit !== 0.62 ? Math.round(pat.lit * 100) : undefined}
              style={unit == null ? undefined : { animationDelay: `${Math.round(unit * d)}ms` }}
            />
          ))}
        </span>
        <span className="lattice-loader__layer lattice-loader__mark">
          {pat.cells.map((_, i) => (
            <span key={i} className="lattice-loader__cell" data-on={marks[mark].includes(i) ? '' : undefined} />
          ))}
        </span>
      </span>
      <span className="lattice-loader__label" aria-hidden="true">
        <span className="lattice-loader__text" data-active={status === 'working' ? '' : undefined}>
          {label}
        </span>
        <span className="lattice-loader__text" data-active={status === 'done' ? '' : undefined}>
          {doneLabel}
        </span>
        <span className="lattice-loader__text" data-active={status === 'error' ? '' : undefined}>
          {errorLabel}
        </span>
      </span>
      {showTimer ? (
        <span ref={timerRef} className="lattice-loader__timer" aria-hidden="true">
          0.0s
        </span>
      ) : null}
      <span className="lattice-loader__sr">{announce}</span>
    </span>
  );
}

return LatticeLoader;
})();

/* ---- FuzzyText: React Bits (official source) ---- */
const FuzzyText = (() => {
const { useEffect, useRef } = React;

const INTRO_PEAK = 2;
const BURST_ATTACK = 70;
const BURST_DECAY = 240;

const followsText = value => !value || /^(currentcolor|inherit)$/i.test(value);

let colorProbe = null;

const toRgb = value => {
  if (!colorProbe) {
    const probe = document.createElement('canvas');
    probe.width = 1;
    probe.height = 1;
    colorProbe = probe.getContext('2d', { willReadFrequently: true });
  }
  if (!colorProbe) return [255, 255, 255];
  colorProbe.clearRect(0, 0, 1, 1);
  colorProbe.fillStyle = '#000';
  colorProbe.fillStyle = value;
  colorProbe.fillRect(0, 0, 1, 1);
  const [r, g, b] = colorProbe.getImageData(0, 0, 1, 1).data;
  return [r, g, b];
};

const channelColor = (rgb, channel, additive) =>
  `rgb(${rgb.map((value, index) => (index === channel ? value : additive ? 0 : 255)).join(',')})`;

const FuzzyText = ({
  children,
  fontSize = 'clamp(2rem, 8vw, 8rem)',
  fontWeight = 900,
  fontFamily = 'inherit',
  color = 'currentColor',
  enableHover = true,
  baseIntensity = 0.18,
  hoverIntensity = 0.5,
  fuzzRange = 30,
  fps = 60,
  direction = 'horizontal',
  transitionDuration = 0,
  clickEffect = false,
  glitchMode = false,
  glitchInterval = 2000,
  glitchDuration = 200,
  gradient = null,
  letterSpacing = 0,
  sliceSize = 1,
  trigger = 'hover',
  intro = false,
  introDuration = 1400,
  colorSplit = 0,
  className = ''
}) => {
  const canvasRef = useRef(null);
  const glitchRef = useRef(false);
  const introRef = useRef({ start: 0, done: !intro });
  const tuningRef = useRef({
    enableHover,
    baseIntensity,
    hoverIntensity,
    fps,
    transitionDuration,
    clickEffect,
    sliceSize,
    trigger,
    intro,
    introDuration,
    colorSplit
  });
  const text = React.Children.toArray(children).join('');
  const gradientKey = Array.isArray(gradient) && gradient.length >= 2 ? gradient.join('|') : '';
  const splitOn = colorSplit > 0;

  useEffect(() => {
    tuningRef.current = {
      enableHover,
      baseIntensity,
      hoverIntensity,
      fps,
      transitionDuration,
      clickEffect,
      sliceSize,
      trigger,
      intro,
      introDuration,
      colorSplit
    };
  }, [
    enableHover,
    baseIntensity,
    hoverIntensity,
    fps,
    transitionDuration,
    clickEffect,
    sliceSize,
    trigger,
    intro,
    introDuration,
    colorSplit
  ]);

  useEffect(() => {
    if (!glitchMode || window.matchMedia?.('(prefers-reduced-motion: reduce)').matches) return;
    let startTimer;
    let endTimer;
    const schedule = () => {
      startTimer = setTimeout(() => {
        glitchRef.current = true;
        endTimer = setTimeout(() => {
          glitchRef.current = false;
          schedule();
        }, glitchDuration);
      }, glitchInterval);
    };
    schedule();
    return () => {
      clearTimeout(startTimer);
      clearTimeout(endTimer);
      glitchRef.current = false;
    };
  }, [glitchMode, glitchInterval, glitchDuration]);

  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = canvas?.getContext('2d');
    const source = document.createElement('canvas');
    const sourceCtx = source.getContext('2d');
    const scratch = document.createElement('canvas');
    const scratchCtx = scratch.getContext('2d');
    const channels = splitOn
      ? [0, 1, 2].map(() => {
          const layer = document.createElement('canvas');
          return { canvas: layer, ctx: layer.getContext('2d') };
        })
      : [];
    if (!canvas || !ctx || !sourceCtx || !scratchCtx || channels.some(channel => !channel.ctx)) return;

    const reduceMotion = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches ?? false;
    const usesInk = followsText(color) && !gradientKey;
    const splitPad = splitOn ? Math.ceil(fuzzRange * 0.5) + 4 : 0;
    const padX = fuzzRange + 20 + (direction === 'vertical' ? 0 : splitPad);
    const padY = direction === 'horizontal' ? 0 : fuzzRange + 10 + (direction === 'vertical' ? splitPad : 0);
    const inset = 5;
    let cancelled = false;
    let built = false;
    let visible = true;
    let frame = 0;
    let resizeFrame = 0;
    let lastFrame = 0;
    let lastInkCheck = 0;
    let clickTimer;
    let hovering = false;
    let clicking = false;
    let burstAt = 0;
    let eased = reduceMotion ? 0 : tuningRef.current.baseIntensity;
    let intensity = eased;
    let coarse = 1;
    let drawn = -1;
    let ink = '';
    let blend = 'lighter';
    let dpr = 1;
    let fontPx = 16;
    let rows = new Int32Array(1);
    let cols = new Int32Array(1);
    let box = { left: 0, ascent: 0, width: 0, height: 0, cssWidth: 0, cssHeight: 0 };

    const family = () => (fontFamily === 'inherit' ? getComputedStyle(canvas).fontFamily || 'sans-serif' : fontFamily);
    const font = () => `${fontWeight} ${fontPx}px ${family()}`;
    const resolveInk = () => (usesInk ? getComputedStyle(canvas).color || '#000' : color);
    const pixelRatio = () => Math.min(window.devicePixelRatio || 1, 2);
    const introPending = () => !introRef.current.done && tuningRef.current.intro && !reduceMotion;

    const measureFontSize = () => {
      if (typeof fontSize === 'number') return fontSize;
      const probe = document.createElement('span');
      probe.style.fontSize = fontSize;
      (canvas.parentElement || document.body).appendChild(probe);
      const size = parseFloat(getComputedStyle(probe).fontSize);
      probe.remove();
      return Number.isFinite(size) && size > 0 ? size : 16;
    };

    const paintText = (target, targetCtx, tone) => {
      target.width = source.width;
      target.height = source.height;
      targetCtx.setTransform(1, 0, 0, 1, 0, 0);
      targetCtx.clearRect(0, 0, target.width, target.height);
      targetCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      targetCtx.font = font();
      targetCtx.textBaseline = 'alphabetic';
      if (gradientKey) {
        const stops = gradientKey.split('|');
        const fill = targetCtx.createLinearGradient(0, 0, box.width + inset * 2, 0);
        stops.forEach((stop, index) => fill.addColorStop(index / (stops.length - 1), tone(stop)));
        targetCtx.fillStyle = fill;
      } else {
        targetCtx.fillStyle = tone(ink);
      }
      if (letterSpacing !== 0) {
        let x = inset;
        for (const char of text) {
          targetCtx.fillText(char, x, box.ascent);
          x += targetCtx.measureText(char).width + letterSpacing;
        }
      } else {
        targetCtx.fillText(text, inset + box.left, box.ascent);
      }
    };

    const paintSource = () => {
      paintText(source, sourceCtx, value => value);
      if (!splitOn) return;
      const tones = (gradientKey ? gradientKey.split('|') : [ink]).map(toRgb);
      const light =
        tones.reduce((sum, [r, g, b]) => sum + (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255, 0) / tones.length >= 0.5;
      blend = light ? 'lighter' : 'multiply';
      channels.forEach((channel, index) =>
        paintText(channel.canvas, channel.ctx, value => channelColor(toRgb(value), index, light))
      );
    };

    const fuzz = (image, shift, jitter, step, amp) => {
      const sw = image.width;
      const sh = image.height;
      const ox = Math.round(padX * dpr);
      const oy = Math.round(padY * dpr);
      const sx = direction === 'vertical' ? 0 : shift;
      const sy = direction === 'vertical' ? shift : 0;
      const wobble = () => (jitter ? Math.round((Math.random() - 0.5) * jitter) : 0);
      if (amp < 0.5) {
        ctx.drawImage(image, ox + sx, oy + sy);
        return;
      }
      if (direction === 'vertical') {
        for (let x = 0, index = 0; x < sw; x += step, index++) {
          const w = Math.min(step, sw - x);
          ctx.drawImage(image, x, 0, w, sh, ox + x, oy + cols[index] + wobble() + sy, w, sh);
        }
        return;
      }
      const both = direction === 'both';
      const target = both ? scratchCtx : ctx;
      if (both) scratchCtx.clearRect(0, 0, scratch.width, scratch.height);
      for (let y = 0, index = 0; y < sh; y += step, index++) {
        const h = Math.min(step, sh - y);
        target.drawImage(image, 0, y, sw, h, ox + rows[index] + wobble() + sx, both ? y : oy + y, sw, h);
      }
      if (!both) return;
      const reach = Math.ceil(amp / 2 + Math.abs(sx) + jitter / 2) + 1;
      const from = Math.max(0, Math.floor((ox - reach) / step) * step);
      const to = Math.min(scratch.width, ox + sw + reach);
      for (let x = from; x < to; x += step) {
        const w = Math.min(step, to - x);
        ctx.drawImage(scratch, x, 0, w, sh, x, oy + cols[x / step], w, sh);
      }
    };

    const draw = () => {
      const tuning = tuningRef.current;
      const step = Math.max(1, Math.round(Math.max(1, tuning.sliceSize) * coarse * dpr));
      const amp = intensity * fuzzRange * dpr;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalCompositeOperation = 'source-over';
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawn = intensity;
      if (amp >= 0.5) {
        if (direction === 'vertical') {
          for (let index = 0; index * step < source.width; index++) {
            cols[index] = Math.round((Math.random() - 0.5) * amp);
          }
        } else {
          for (let index = 0; index * step < source.height; index++) {
            rows[index] = Math.round((Math.random() - 0.5) * amp);
          }
          if (direction === 'both') {
            for (let index = 0; index * step < canvas.width; index++) {
              cols[index] = Math.round((Math.random() - 0.5) * amp * 0.5);
            }
          }
        }
      }
      const split = splitOn ? Math.round(tuning.colorSplit * (2 + intensity * fuzzRange * 0.18) * dpr) : 0;
      if (split < 1) {
        fuzz(source, 0, 0, step, amp);
        return;
      }
      const jitter = tuning.colorSplit * amp * 0.2;
      ctx.globalCompositeOperation = blend;
      fuzz(channels[0].canvas, -split, jitter, step, amp);
      fuzz(channels[1].canvas, 0, 0, step, amp);
      fuzz(channels[2].canvas, split, jitter, step, amp);
      ctx.globalCompositeOperation = 'source-over';
    };

    const build = () => {
      dpr = pixelRatio();
      fontPx = measureFontSize();
      sourceCtx.setTransform(1, 0, 0, 1, 0, 0);
      sourceCtx.font = font();
      const metrics = sourceCtx.measureText(text);
      const left = metrics.actualBoundingBoxLeft ?? 0;
      let width = left + (metrics.actualBoundingBoxRight ?? metrics.width);
      if (letterSpacing !== 0) {
        width = -letterSpacing;
        for (const char of text) width += sourceCtx.measureText(char).width + letterSpacing;
      }
      const ascent = metrics.actualBoundingBoxAscent ?? fontPx;
      const descent = metrics.actualBoundingBoxDescent ?? fontPx * 0.2;
      const textWidth = Math.max(1, Math.ceil(width));
      const textHeight = Math.max(1, Math.ceil(ascent + descent));
      box = {
        left,
        ascent,
        width: textWidth,
        height: textHeight,
        cssWidth: textWidth + inset * 2 + padX * 2,
        cssHeight: textHeight + padY * 2
      };
      source.width = Math.ceil((textWidth + inset * 2) * dpr);
      source.height = Math.ceil(textHeight * dpr);
      canvas.width = Math.ceil(box.cssWidth * dpr);
      canvas.height = Math.ceil(box.cssHeight * dpr);
      scratch.width = canvas.width;
      scratch.height = source.height;
      rows = new Int32Array(source.height + 1);
      cols = new Int32Array(canvas.width + 1);
      canvas.style.width = `${box.cssWidth}px`;
      canvas.style.height = `${box.cssHeight}px`;
      if (introPending() && !introRef.current.start) canvas.style.opacity = '0';
      ink = resolveInk();
      paintSource();
      built = true;
      draw();
    };

    const tick = now => {
      frame = 0;
      if (cancelled || !visible) return;
      frame = requestAnimationFrame(tick);
      const tuning = tuningRef.current;
      const interval = 1000 / Math.max(1, tuning.fps);
      if (now - lastFrame < interval - 1) return;
      lastFrame = Math.max(lastFrame + interval, now - interval);
      if (usesInk && now - lastInkCheck > 250) {
        lastInkCheck = now;
        const next = resolveInk();
        if (next !== ink) {
          ink = next;
          paintSource();
          drawn = -1;
        }
      }
      const base = reduceMotion ? 0 : tuning.baseIntensity;
      const active =
        tuning.trigger === 'always'
          ? reduceMotion
            ? base
            : tuning.hoverIntensity
          : tuning.trigger !== 'click' && hovering && tuning.enableHover
            ? tuning.hoverIntensity
            : base;
      const goal = clicking || glitchRef.current ? 1 : active;
      if (tuning.transitionDuration > 0) {
        eased += (goal - eased) * (1 - Math.pow(0.05, 1 / tuning.transitionDuration));
        if (Math.abs(goal - eased) < 0.002) eased = goal;
      } else {
        eased = goal;
      }
      let level = eased;
      let energy = 0;
      if (burstAt) {
        const age = now - burstAt;
        const envelope =
          age < BURST_ATTACK ? 1 - Math.pow(1 - age / BURST_ATTACK, 2) : Math.exp(-(age - BURST_ATTACK) / BURST_DECAY);
        if (age >= BURST_ATTACK && envelope < 0.004) {
          burstAt = 0;
        } else {
          const peak = Math.min(2, 0.6 + tuning.hoverIntensity * 1.4);
          level += (Math.max(peak, level) - level) * envelope;
          energy = envelope;
        }
      }
      const introState = introRef.current;
      if (!introState.done) {
        if (!tuning.intro || reduceMotion) {
          introState.done = true;
          canvas.style.opacity = '';
        } else {

  float s = sin(aStyle.w);
  vec2 local = aCorner * 1.25;
  vec2 offset = vec2(c * local.x - s * local.y, s * local.x + c * local.y) * aSprite.z;
  vec3 world = vec3(aSprite.xy + offset, 0.0);
  vec3 eye = vec3(0.0, -uDistance * st, uDistance * ct);
  vec3 rel = world - eye;
  float xc = rel.x;
  float yc = dot(rel, vec3(0.0, ct, st));
  float zc = max(dot(rel, vec3(0.0, st, -ct)), 0.0001);
  vec2 center = uCenter / uResolution * 2.0 - 1.0;
  gl_Position = vec4(center * zc + 2.0 * uFocal * uViewHeight * vec2(xc, yc) / uResolution, 0.0, zc);
  vLocal = local;
  vStyle = aStyle;
  vKind = aSprite.w;
}`;

const SPRITE_FRAGMENT = `#version 300 es
precision highp float;
in vec2 vLocal;
in vec4 vStyle;
in float vKind;
uniform vec3 uAccent;
uniform float uRange;
out vec4 outColor;
void main() {
  float shape;
  vec3 tint;
  if (vKind < 0.5) {
    float d = length(vLocal * vec2(0.62, 1.0));
    float aa = max(fwidth(d), 0.0001);
    shape = clamp((1.0 - d) / aa + 0.5, 0.0, 1.0);
    shape *= 0.5 + 0.5 * exp(-d * d * 2.5);
    tint = mix(uAccent, vec3(1.0), vStyle.y * 0.45 * exp(-d * d * 5.0));
  } else {
    float d = length(vLocal);
    float aa = max(fwidth(d), 0.0001);
    shape = clamp(1.0 - abs(d - 1.0) / (aa * 0.75), 0.0, 1.0);
    tint = mix(uAccent, vec3(1.0), 0.2);
  }
  outColor = vec4(tint * shape * vStyle.x * uRange, 1.0);
}`;

const DOWN = `#version 300 es
precision highp float;
uniform sampler2D uSource;
uniform vec2 uTexel;
uniform vec2 uTarget;
out vec4 outColor;
void main() {
  vec2 uv = gl_FragCoord.xy / uTarget;
  vec4 sum = texture(uSource, uv) * 4.0;
  sum += texture(uSource, uv - uTexel);
  sum += texture(uSource, uv + uTexel);
  sum += texture(uSource, uv + vec2(uTexel.x, -uTexel.y));
  sum += texture(uSource, uv - vec2(uTexel.x, -uTexel.y));
  outColor = sum / 8.0;
}`;

const UP = `#version 300 es
precision highp float;
uniform sampler2D uSource;
uniform sampler2D uBase;
uniform vec2 uTexel;
uniform vec2 uTarget;
out vec4 outColor;
void main() {
  vec2 uv = gl_FragCoord.xy / uTarget;
  vec2 h = uTexel * 0.5;
  vec4 sum = texture(uSource, uv + vec2(-h.x * 2.0, 0.0));
  sum += texture(uSource, uv + vec2(h.x * 2.0, 0.0));
  sum += texture(uSource, uv + vec2(0.0, -h.y * 2.0));
  sum += texture(uSource, uv + vec2(0.0, h.y * 2.0));
  sum += texture(uSource, uv + vec2(-h.x, h.y)) * 2.0;
  sum += texture(uSource, uv + h) * 2.0;
  sum += texture(uSource, uv + vec2(h.x, -h.y)) * 2.0;
  sum += texture(uSource, uv - h) * 2.0;
  outColor = sum / 12.0 + texture(uBase, uv);
}`;

const COMPOSITE = `#version 300 es
precision highp float;
uniform sampler2D uScene;
uniform sampler2D uBloom;
uniform vec2 uResolution;
uniform float uExposure;
uniform float uGlow;
uniform float uGrain;
uniform float uFade;
uniform float uOpacity;
uniform float uTime;
uniform float uLightMode;
uniform vec4 uBackground;
out vec4 outColor;

float hash(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

float smootherstep(float edge, float x) {
  float t = clamp(x / max(edge, 0.0001), 0.0, 1.0);
  return t * t * t * (t * (t * 6.0 - 15.0) + 10.0);
}

void main() {
  vec2 uv = gl_FragCoord.xy / uResolution;
  vec3 hdr = texelFetch(uScene, ivec2(gl_FragCoord.xy), 0).rgb * uExposure;
  vec3 bloom = texture(uBloom, uv).rgb * uExposure * uGlow * 0.5;
  float edge = uFade * 0.5;
  float mask = smootherstep(edge, uv.x) * smootherstep(edge, 1.0 - uv.x) * smootherstep(edge, uv.y) * smootherstep(edge, 1.0 - uv.y);
  mask *= uOpacity;
  float grain = (hash(gl_FragCoord.xy + fract(uTime * 7.31) * 113.0) - 0.5) * uGrain;
  vec4 color;
  if (uLightMode > 0.5) {
    float bloomPeak = max(bloom.r, max(bloom.g, bloom.b));
    float bloomLow = min(bloom.r, min(bloom.g, bloom.b));
    vec3 total = hdr + bloom * 0.3 * (bloomPeak - bloomLow) / max(bloomPeak, 0.0001);
    float peak = max(total.r, max(total.g, total.b));
    vec3 hue = total / max(peak, 0.0001);
    float tone = dot(hue, vec3(0.2126, 0.7152, 0.0722));
    float depth = mix(0.36, 0.09, smoothstep(0.06, 0.7, peak));
    vec3 ink = pow(clamp(hue * min(1.0, depth / max(tone, 0.001)), 0.0, 1.0), vec3(1.0 / 2.2));
    float alpha = clamp((1.0 - exp(-peak * 2.6)) * (1.0 + grain), 0.0, 1.0) * mask;
    color = vec4(ink * alpha, alpha);
  } else {
    vec3 mapped = 1.0 - exp(-(hdr + bloom));
    float level = max(mapped.r, max(mapped.g, mapped.b));
    mapped = clamp(mapped + grain * level, 0.0, 1.0) * mask;
    color = vec4(mapped, max(mapped.r, max(mapped.g, mapped.b)));
  }
  vec4 back = vec4(uBackground.rgb * uBackground.a, uBackground.a);
  outColor = color + back * (1.0 - color.a);
}`;

const TAU = Math.PI * 2;
const MAX_TARGETS = 16;
const HISTORY = 4;
const FOCAL = 2;
const INTRO_SECONDS = 2.2;
const MAX_RENDER_DIM = 2560;
const BLOOM_LEVELS = 5;

const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

const seeded = seed => {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};

const compile = (gl, type, source) => {
  const shader = gl.createShader(type);
  if (!shader) return null;
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (gl.getShaderParameter(shader, gl.COMPILE_STATUS)) return shader;
  gl.deleteShader(shader);
  return null;
};

const link = (gl, vertexSource, fragmentSource, attributes) => {
  const vertex = compile(gl, gl.VERTEX_SHADER, vertexSource);
  const fragment = compile(gl, gl.FRAGMENT_SHADER, fragmentSource);
  const program = gl.createProgram();
  if (!vertex || !fragment || !program) return null;
  gl.attachShader(program, vertex);
  gl.attachShader(program, fragment);
  attributes.forEach((name, index) => gl.bindAttribLocation(program, index, name));
  gl.linkProgram(program);
  gl.deleteShader(vertex);
  gl.deleteShader(fragment);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    gl.deleteProgram(program);
    return null;
  }
  const uniforms = {};
  const count = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < count; i++) {
    const info = gl.getActiveUniform(program, i);
    if (info) uniforms[info.name] = gl.getUniformLocation(program, info.name);
  }
  return { program, uniforms };
};

const spawnTarget = (rng, inward) => {
  const angle = rng() * TAU;
  const radius = inward ? 0.94 : 0.2 + rng() * 0.68;
  const heading = inward ? angle + Math.PI + (rng() - 0.5) * 1.6 : rng() * TAU;
  return {
    x: Math.sin(angle) * radius,
    y: Math.cos(angle) * radius,
    heading,
    velocity: 0.012 + rng() * 0.03,
    turn: (rng() - 0.5) * 0.18
  };
};

function Radar({
  color = '#3ef09a',
  backgroundColor = 'transparent',
  mode = 'sweep',
  speed = 1,
  trail = 0.35,
  scale = 0.9,
  ringCount = 6,
  spokeCount = 12,
  ticks = true,
  targets = 6,
  clutter = 0.35,
  glow = 1,
  brightness = 1,
  gridOpacity = 1,
  lineWidth = 1,
  tilt = 0,
  centerX = 0.5,
  centerY = 0.5,
  mouseInteraction = true,
  intro = true,
  grain = 0.03,
  fade = 0,
  opacity = 1,
  lightMode = false,
  paused = false,
  dpr,
  className = '',
  ...rest
}) {
  const containerRef = useRef(null);
  const canvasRef = useRef(null);
  const wakeRef = useRef(null);
  const settings = {
    color: String(color),
    backgroundColor: String(backgroundColor),
    mode: mode === 'pulse' ? 'pulse' : 'sweep',
    speed,
    trail: clamp(trail, 0.02, 1),
    scale: Math.max(0.05, scale),
    ringCount: Math.round(clamp(ringCount, 1, 24)),
    spokeCount: Math.round(clamp(spokeCount, 0, 72)),
    ticks,
    targets: Math.round(clamp(targets, 0, MAX_TARGETS)),
    clutter: clamp(clutter, 0, 1),
    glow: Math.max(0, glow),
    brightness: Math.max(0, brightness),
    gridOpacity: clamp(gridOpacity, 0, 2),
    lineWidth: clamp(lineWidth, 0.25, 4),
    tilt: (clamp(tilt, 0, 80) * Math.PI) / 180,
    centerX,
    centerY,
    mouseInteraction,
    intro,
    grain: Math.max(0, grain),
    fade: clamp(fade, 0, 1),
    opacity: clamp(opacity, 0, 1),
    lightMode,
    paused,
    dpr
  };
  const settingsRef = useRef(settings);
  settingsRef.current = settings;

  useEffect(() => {
    const container = containerRef.current;
    const canvas = canvasRef.current;
    const gl = canvas?.getContext('webgl2', {
      alpha: true,
      premultipliedAlpha: true,
      antialias: false,
      depth: false,
      stencil: false
    });
    if (!container || !canvas || !gl) return undefined;

    const floatTargets = !!gl.getExtension('EXT_color_buffer_float');
    const range = floatTargets ? 1 : 0.25;
    const programs = {
      scene: link(gl, QUAD_VERTEX, SCENE, ['aPosition']),
      sprite: link(gl, SPRITE_VERTEX, SPRITE_FRAGMENT, ['aCorner', 'aSprite', 'aStyle']),
      down: link(gl, QUAD_VERTEX, DOWN, ['aPosition']),
      up: link(gl, QUAD_VERTEX, UP, ['aPosition']),
      composite: link(gl, QUAD_VERTEX, COMPOSITE, ['aPosition'])
    };
    if (Object.values(programs).some(entry => !entry)) return undefined;

    const quadBuffer = gl.createBuffer();
    const quadVao = gl.createVertexArray();
    gl.bindVertexArray(quadVao);
    gl.bindBuffer(gl.ARRAY_BUFFER, quadBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

    const cornerBuffer = gl.createBuffer();
    const instanceBuffer = gl.createBuffer();
    const spriteVao = gl.createVertexArray();
    gl.bindVertexArray(spriteVao);
    gl.bindBuffer(gl.ARRAY_BUFFER, cornerBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, instanceBuffer);
    for (let attribute = 1; attribute <= 2; attribute++) {
      gl.enableVertexAttribArray(attribute);
      gl.vertexAttribPointer(attribute, 4, gl.FLOAT, false, 32, (attribute - 1) * 16);
      gl.vertexAttribDivisor(attribute, 1);
    }
    gl.bindVertexArray(null);

    const createTarget = () => ({
      texture: gl.createTexture(),
      framebuffer: gl.createFramebuffer(),
      width: 0,
      height: 0
    });
    const sizeTarget = (target, width, height) => {
      if (target.width === width && target.height === height) return;
      target.width = width;
      target.height = height;
      gl.bindTexture(gl.TEXTURE_2D, target.texture);
      if (floatTargets) {
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, width, height, 0, gl.RGBA, gl.HALF_FLOAT, null);
      } else {
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, width, height, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
      }
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.bindFramebuffer(gl.FRAMEBUFFER, target.framebuffer);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, target.texture, 0);
    };
    const scene = createTarget();
    const down = Array.from({ length: BLOOM_LEVELS + 1 }, createTarget);
    const up = Array.from({ length: BLOOM_LEVELS }, createTarget);

    const probe = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
    const reduce = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches ?? false;
    const colorCache = new Map();
    const parseColor = value => {
      if (colorCache.has(value)) return colorCache.get(value);
      let rgba = [1, 1, 1, 1];
      if (probe) {
        probe.clearRect(0, 0, 1, 1);
        probe.fillStyle = 'rgba(0, 0, 0, 0)';
        probe.fillStyle = value;
        probe.fillRect(0, 0, 1, 1);
        const [r, g, b, a] = probe.getImageData(0, 0, 1, 1).data;
        rgba = a ? [r / a, g / a, b / a, a / 255] : [0, 0, 0, 0];
      }
      colorCache.set(value, rgba);
      return rgba;
    };
    const toLinear = value =>
      parseColor(value)
        .slice(0, 3)
        .map(v => Math.pow(v, 2.2));

    const rng = seeded(7919);
    const contacts = Array.from({ length: MAX_TARGETS }, () => ({ ...spawnTarget(rng, false), echoes: [] }));
    const cursor = { x: 0, y: 0, inside: false, echoes: [] };
    const pointer = { x: 0, y: 0, inside: false };
    const view = { width: 1, height: 1, ratio: 1 };
    const state = {
      time: 0,
      sweep: 0,
      swept: 0,
      cycle: 0,
      intro: settingsRef.current.intro && !reduce ? 0 : 1,
      heat: 0,
      heatVelocity: 0,
      heatX: 0,
      heatY: 0
    };
    const instances = new Float32Array(8 * 160);
    let raf = 0;
    let last = 0;
    let visible = true;

    const fit = s => (s.scale * Math.min(view.width, view.height)) / view.height;

    const camera = s => ({ distance: (2 * FOCAL) / fit(s), focal: FOCAL, tilt: s.tilt });

    const toPlane = (s, x, y) => {
      const { distance, focal, tilt } = camera(s);
      const sx = (x - s.centerX * view.width) / view.height;
      const sy = (s.centerY * view.height - y) / view.height;
      const ct = Math.cos(tilt);
      const st = Math.sin(tilt);
      const dx = sx;
      const dy = focal * st + sy * ct;
      const dz = -focal * ct + sy * st;
      if (dz > -0.0001) return null;
      const ey = -distance * st;
      const ez = distance * ct;
      const t = -ez / dz;
      return [dx * t, ey + dy * t];
    };

    const period = s => (s.mode === 'pulse' ? 3.2 : 6);

    const advance = (s, dt) => {
      const step = dt * Math.abs(s.speed);
      const pulse = s.mode === 'pulse';
      const span = pulse ? 1.15 : TAU;
      const delta = (step / period(s)) * span;
      const direction = s.speed < 0 && !pulse ? -1 : 1;
      const previous = state.sweep;
      state.swept += delta;
      const record = contact => {
        contact.echoes.unshift({ x: contact.x, y: contact.y, time: state.time });
        if (contact.echoes.length > HISTORY) contact.echoes.length = HISTORY;
      };
      const passed = (x, y) => {
        if (pulse) {
          const radius = Math.hypot(x, y);
          const from = previous;
          const to = previous + delta;
          return (radius > from && radius <= to) || (to > span && radius <= to - span);
        }
        const bearing = Math.atan2(x, y);
        const gap = (((direction * (bearing - previous)) % TAU) + TAU) % TAU;
        return gap > 0 && gap <= delta;
      };
      for (let i = 0; i < s.targets; i++) {
        const contact = contacts[i];
        contact.heading += contact.turn * step;
        contact.x += Math.sin(contact.heading) * contact.velocity * step;
        contact.y += Math.cos(contact.heading) * contact.velocity * step;
        if (Math.hypot(contact.x, contact.y) > 0.96) Object.assign(contact, spawnTarget(rng, true));
        if (passed(contact.x, contact.y)) record(contact);
      }
      if (cursor.inside && passed(cursor.x, cursor.y)) record(cursor);
      state.sweep += direction * delta;
      while (state.sweep >= span) {
        state.sweep -= span;
        state.cycle += 1;
      }
      while (state.sweep < 0) {
        state.sweep += span;
        state.cycle += 1;
      }
    };

    const buildSprites = s => {
      const unit = 2 / (fit(s) * view.height);
      const persist = (period(s) / Math.max(Math.abs(s.speed), 0.05)) * 1.1;
      let count = 0;
      const push = (x, y, radius, kind, intensity, core, angle) => {
        if (count * 8 + 8 > instances.length) return;
        instances.set([x, y, radius, kind, intensity, core, 0, angle], count * 8);
        count++;
      };
      const emit = (contact, strength) => {
        contact.echoes.forEach((echo, index) => {
          const age = state.time - echo.time;
          const fade = Math.exp(-age / persist) * (index === 0 ? 1 : 0.8);
          if (fade < 0.01) return;
          const angle = -Math.atan2(echo.x, echo.y);
          push(
            echo.x,
            echo.y,
            unit * (index === 0 ? 3.4 : 2.4),
            0,
            fade * strength * 2.2,
            index === 0 ? 1 : 0.3,
            angle
          );
          if (index === 0 && age < 1.4) {
            const progress = age / 1.4;
            const eased = 1 - Math.pow(1 - progress, 3);
            push(echo.x, echo.y, unit * (4 + 26 * eased), 1, (1 - progress) * (1 - progress) * strength * 1.4, 0, 0);
          }
        });
      };
      for (let i = 0; i < s.targets; i++) emit(contacts[i], 1);
      emit(cursor, 1.3);
      return count;
    };

    const run = (entry, target, width, height) => {
      gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.framebuffer : null);
      gl.viewport(0, 0, width, height);
      gl.useProgram(entry.program);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    };

    const bindTexture = (entry, name, unit, texture) => {
      gl.activeTexture(gl.TEXTURE0 + unit);
      gl.bindTexture(gl.TEXTURE_2D, texture);
      gl.uniform1i(entry.uniforms[name], unit);
    };

    const setCamera = (entry, s) => {
      const u = entry.uniforms;
      const { distance, focal, tilt } = camera(s);
      gl.uniform2f(u.uResolution, canvas.width, canvas.height);
      gl.uniform2f(u.uCenter, s.centerX * canvas.width, (1 - s.centerY) * canvas.height);
      gl.uniform1f(u.uViewHeight, canvas.height);
      gl.uniform1f(u.uFocal, focal);
      gl.uniform1f(u.uDistance, distance);
      gl.uniform1f(u.uTilt, tilt);
    };

    const render = () => {
      const s = settingsRef.current;
      const accent = toLinear(s.color);
      const presence = state.intro;
      sizeTarget(scene, canvas.width, canvas.height);

      const sceneProgram = programs.scene;
      const u = sceneProgram.uniforms;
      gl.useProgram(sceneProgram.program);
      setCamera(sceneProgram, s);
      gl.uniform1f(u.uMode, s.mode === 'pulse' ? 1 : 0);
      gl.uniform1f(u.uSweep, state.sweep);
      gl.uniform1f(u.uSwept, Math.min(state.swept, TAU + 1));
      gl.uniform1f(u.uDirection, s.speed < 0 && s.mode !== 'pulse' ? -1 : 1);
      gl.uniform1f(u.uCycle, state.cycle);
      gl.uniform1f(u.uTrail, s.mode === 'pulse' ? s.trail * 0.22 : s.trail * TAU * 0.5);
      gl.uniform1f(u.uRings, s.ringCount);
      gl.uniform1f(u.uSpokes, s.spokeCount);
      gl.uniform1f(u.uTicks, s.ticks ? 1 : 0);
      gl.uniform1f(u.uGrid, s.gridOpacity);
      gl.uniform1f(u.uLine, s.lineWidth * view.ratio);
      gl.uniform1f(u.uClutter, s.clutter * (s.lightMode ? 0.6 : 1));
      gl.uniform1f(u.uTime, state.time);
      gl.uniform3fv(u.uAccent, accent);
      gl.uniform3f(u.uHeat, state.heatX, state.heatY, state.heat);
      gl.uniform1f(u.uIntro, presence);
      gl.uniform1f(u.uRange, range);
      gl.uniform1f(u.uPixel, view.ratio);
      gl.bindVertexArray(quadVao);
      run(sceneProgram, scene, canvas.width, canvas.height);

      const count = buildSprites(s);
      if (count > 0) {
        const sprite = programs.sprite;
        gl.useProgram(sprite.program);
        setCamera(sprite, s);
        gl.uniform3fv(sprite.uniforms.uAccent, accent);
        gl.uniform1f(sprite.uniforms.uRange, range * Math.min(1, presence * 2));
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.ONE, gl.ONE);
        gl.bindVertexArray(spriteVao);
        gl.bindBuffer(gl.ARRAY_BUFFER, instanceBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, instances.subarray(0, count * 8), gl.DYNAMIC_DRAW);
        gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, count);
        gl.disable(gl.BLEND);
      }

      gl.bindVertexArray(quadVao);
      let source = scene;
      for (let level = 0; floatTargets && level <= BLOOM_LEVELS; level++) {
        const target = down[level];
        const width = level === 0 ? Math.round(view.width / 2) : source.width >> 1;
        const height = level === 0 ? Math.round(view.height / 2) : source.height >> 1;
        sizeTarget(target, Math.max(1, width), Math.max(1, height));
        gl.useProgram(programs.down.program);
        gl.uniform2f(programs.down.uniforms.uTexel, 1 / source.width, 1 / source.height);
        gl.uniform2f(programs.down.uniforms.uTarget, target.width, target.height);
        bindTexture(programs.down, 'uSource', 0, source.texture);
        run(programs.down, target, target.width, target.height);
        source = target;
      }
      for (let level = BLOOM_LEVELS - 1; floatTargets && level >= 0; level--) {
        const from = level === BLOOM_LEVELS - 1 ? down[BLOOM_LEVELS] : up[level + 1];
        const target = up[level];
        sizeTarget(target, down[level].width, down[level].height);
        gl.useProgram(programs.up.program);

      view.height = height;

  });

    <div ref={containerRef} className={`radar-container${className ? ` ${className}` : ''}`} {...rest}>
      <canvas ref={canvasRef} className="radar-canvas" aria-hidden="true" />
    </div>
  );
}

return Radar;
})();

    try {
      cardRef.current?.setPointerCapture(e.pointerId);
    } catch {}
    y.stop();
    drag.current = {
      id: e.pointerId,
      startY: e.clientY,
      grab: null,
      moved: false,

      d.grab = e.clientY - y.get();

      data-phase={phase}
      data-inline={inline ? 'true' : 'false'}
      data-fuse={duration > 0 ? fuse : 'none'}

      data-instant={instant ? '' : undefined}
      data-mounted={mounted ? 'true' : 'false'}

        '--st-fuse': fuseColor,
        '--st-w': `${width}px`,
        '--st-radius': `${radius}px`,
        '--st-slide': `${slideMs}ms`,
        '--st-gap': '10px'
      }}
    >
      <div className="swipe-toast__gate">

            role="status"
            aria-live="polite"
            aria-atomic="true"
            tabIndex={0}
            style={{ transform, opacity: fade }}
            onPointerDown={onPointerDown}
            onPointerMove={onPointerMove}
            onPointerUp={onPointerUp}
            onPointerCancel={onPointerUp}
            onPointerEnter={e => {

            onPointerLeave={e => {

                syncFuse();

            onFocus={() => {

            }}
            onBlur={e => {
              if (!e.currentTarget.contains(e.relatedTarget)) {
                flags.current.focus = false;
                syncFuse();
              }
            }}

                {icon}

            ) : null}
            <span className="swipe-toast__body">
              <span className="swipe-toast__title">{title}</span>
              {description ? <span className="swipe-toast__desc">{description}</span> : null}
            </span>
            {actionLabel ? (
              <button
                type="button"
                className="swipe-toast__action"
                onClick={() => {
                  latest.current.onAction?.();
                  close('action');
                }}

            ) : null}
            {closeButton ? (
              <button type="button" className="swipe-toast__close" aria-label="Close" onClick={() => close('close')}>

            <i ref={fuseRef} className="swipe-toast__fuse" aria-hidden="true" />

    </div>
  );

/* ---- seeded random, dates ---- */
const mulberry32 = seed => () => {
  seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
const TODAY = new Date(2026, 9, 17); // Sat 17 Oct 2026
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const WDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const fmtDay = d => `${WDAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
const fmtShort = d => `${d.getDate()} ${MONTHS[d.getMonth()]}`;

const daysAgo = n => new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate() - n);

/* ---- the year of activity (same seed and fixes as the Overview, so numbers agree) ---- */
const makeYear = () => {
  const rand = mulberry32(1707);
  const days = [];
  const total = 371;
  for (let i = total - 1; i >= 0; i--) {
    const date = daysAgo(i);
    const dow = date.getDay();
    const weekend = dow === 0 || dow === 6;
    const holiday = date.getMonth() === 7 && date.getDate() >= 10 && date.getDate() <= 18;
    let count = 0;
    if (!holiday && rand() > (weekend ? 0.38 : 0.12)) {
      const g = (rand() + rand() + rand() - 1.5) * 0.9;
      count = Math.max(1, Math.round(Math.exp(3.25 + g) * (weekend ? 0.55 : 1)));
    }
    days.push({ date, count });
  }
  const n = days.length;
  // a 41-day streak in spring, so "Longest this year: 41" on the Overview is true
  for (let k = 0; k < 41; k++) if (days[n - 230 + k].count === 0) days[n - 230 + k].count = 4 + Math.floor(rand() * 18);
  days[n - 231].count = 0; days[n - 189].count = 0;
  for (let k = 1; k <= 23; k++) if (days[n - k].count === 0) days[n - k].count = 6 + Math.floor(rand() * 20);
  days[n - 24].count = 0;
  days[n - 1].count = 47;
  days[n - 12].count = 38;
  return days;
};
const YEAR = makeYear();

const useTheme = () => {
  const query = window.matchMedia('(prefers-color-scheme: dark)');
  const [choice, setChoice] = useState(['light', 'dark'].includes(QS.get('theme')) ? QS.get('theme') : 'system');
  const [systemDark, setSystemDark] = useState(query.matches);
  useEffect(() => {
    const on = e => setSystemDark(e.matches);
    query.addEventListener('change', on);
    return () => query.removeEventListener('change', on);
  }, []);
  useEffect(() => {
    if (choice === 'system') delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = choice;
  }, [choice]);
  const mode = choice === 'system' ? (systemDark ? 'dark' : 'light') : choice;
  return { choice, setChoice, mode, systemDark };
};

const usePrefersReduced = () => {
  const q = window.matchMedia('(prefers-reduced-motion: reduce)');
  const [r, setR] = useState(q.matches);
  useEffect(() => {
    const on = e => setR(e.matches);
    q.addEventListener('change', on);
    return () => q.removeEventListener('change', on);
  }, []);
  return r;
};

/* ---- review-only state switcher: data / loading / waking / error / empty, plus a real cold start ---- */
const STATES = [['data', 'Data'], ['loading', 'Loading'], ['waking', 'Waking up'], ['error', 'Error'], ['empty', 'Empty']];
const useReview = () => {
  const start = STATES.some(s => s[0] === QS.get('state')) ? QS.get('state') : 'data';
  const [state, setState] = useState(start);
  const [since, setSince] = useState(() => Date.now() - (start === 'waking' ? 14000 : 0));
  const timers = useRef([]);
  const clear = () => { timers.current.forEach(clearTimeout); timers.current = []; };
  const go = s => { clear(); setState(s); setSince(Date.now() - (s === 'waking' ? 14000 : 0)); };
  const later = (ms, fn) => timers.current.push(setTimeout(fn, ms));
  // the decided rule (Doc 08): a first request slower than 3 s turns "loading" into "waking up"
  const cold = () => { go('loading'); setSince(Date.now()); later(3000, () => setState('waking')); later(16000, () => setState('data')); };
  const retry = () => { go('loading'); later(1200, () => setState('data')); };
  useEffect(() => clear, []);
  return { state, since, go, cold, retry };
};

/* ---- toasts: React Bits SwipeToast, one at a time ---- */
const useToasts = () => {
  const [t, setT] = useState(null);
  const say = (title, description = '', extra = {}) => setT({ key: Date.now(), title, description, ...extra });
  const node = t && (
    <SwipeToast key={t.key} title={t.title} description={t.description} icon={t.icon ?? I.info}
                actionLabel={t.actionLabel} onAction={t.onAction}
                background="var(--ink)" color="var(--bg)" fuseColor="var(--accent)"
                width={380} radius={10} duration={t.duration ?? 4200} closeButton
                onClose={() => setT(cur => (cur && cur.key === t.key ? null : cur))} />
  );
  return { say, node };
};

  if (state === 'empty') return <span className="pill pill-wait">{I.devices} No laptop has synced yet</span>;
  return <span className="pill">{I.ok} Last synced 3 minutes ago</span>;
}

/* ---- waking up the server: shown when the first request takes longer than 3 s ---- */
function WakingPanel({ since, ctx, what }) {
  const [now, setNow] = useState(Date.now());
  useEffect(() => { const t = setInterval(() => setNow(Date.now()), 100); return () => clearInterval(t); }, []);
  const secs = Math.max(0, (now - since) / 1000);
  return (
    <section className="state-panel waking card" aria-live="polite">
      <div className="waking-radar" aria-hidden="true">
        <Radar color={ctx.accent} lightMode={!ctx.dark} speed={0.6} ringCount={5} spokeCount={8} targets={1}
               clutter={0.1} grain={0} glow={0.7} brightness={ctx.dark ? 0.9 : 1} mouseInteraction={false}
               scale={0.95} paused={ctx.reduced} />

      <div className="state-copy">

        <p>This can take up to a minute on the free tier. {what} appears here by itself as soon as it answers; you do not need to reload.</p>
        <p className="state-fine">The free server sleeps when nobody has used it for a while. Your laptop keeps

      </div>

  );

/* ---- calendar heatmap (custom SVG, Doc 08; identical to the Overview's) ---- */
const RAMPS = {
  light: ['#EDEDEA', '#86B6EF', '#3987E5', '#256ABF', '#104281'],
  dark: ['#2A3440', '#1C5CAB', '#2A78D6', '#5598E7', '#9EC5F4']
};
const quartiles = values => {
  const s = values.filter(v => v > 0).sort((a, b) => a - b);
  if (!s.length) return [0, 0, 0];
  const at = p => s[Math.min(s.length - 1, Math.floor(p * (s.length - 1)))];
  return [at(0.25), at(0.5), at(0.75)];
};
function CalendarHeatmap({ days, mode, cell = 12 }) {
  const CELL = cell, GAP = 3, STEP = CELL + GAP, LEFT = 30, TOP = 18;
  const ramp = RAMPS[mode];
  const [q1, q2, q3] = useMemo(() => quartiles(days.map(d => d.count)), [days]);
  const level = c => (c === 0 ? 0 : c <= q1 ? 1 : c <= q2 ? 2 : c <= q3 ? 3 : 4);
  const [tip, setTip] = useState(null);
  const first = days[0].date;
  const lead = (first.getDay() + 6) % 7;
  const cells = days.map((d, i) => ({ ...d, col: Math.floor((i + lead) / 7), row: (i + lead) % 7 }));
  const cols = cells[cells.length - 1].col + 1;
  const months = [];
  cells.forEach(c => { if (c.date.getDate() === 1) months.push({ col: c.row === 0 ? c.col : c.col + 1, name: MONTHS[c.date.getMonth()] }); });
  const width = LEFT + cols * STEP - GAP;
  const height = TOP + 7 * STEP - GAP;
  const total = days.reduce((a, d) => a + d.count, 0);
  const active = days.filter(d => d.count > 0).length;
  return (
    <>
      <div className="cal-body">
        <svg className="cal-svg" width={width} height={height} role="img"
             aria-label={`Activity calendar: ${total.toLocaleString()} commands on ${active} days over the last year`}
             onMouseLeave={() => setTip(null)}>
          {months.map(m => <text key={`${m.name}${m.col}`} x={LEFT + m.col * STEP} y={11}>{m.name}</text>)}
          {['Mon', '', 'Wed', '', 'Fri', '', ''].map((d, r) => d && <text key={d} x={0} y={TOP + r * STEP + 10}>{d}</text>)}
          {cells.map((c, i) => (
            <rect key={i} className={`day${tip && tip.i === i ? ' hot' : ''}`}
                  x={LEFT + c.col * STEP} y={TOP + c.row * STEP} width={CELL} height={CELL} rx={2.5}
                  fill={ramp[level(c.count)]}
                  onMouseEnter={() => setTip({ i, x: LEFT + c.col * STEP + CELL / 2 + 24, y: TOP + c.row * STEP + 14, c })} />
          ))}
        </svg>
        {tip && (
          <div className="cal-tip" style={{ left: tip.x, top: tip.y }}>
            {fmtDay(tip.c.date)} · <b>{tip.c.count}</b> {tip.c.count === 1 ? 'command' : 'commands'}
          </div>
        )}
      </div>
      <div className="cal-key">
        <span>Grey = no commands. Blue steps = quartiles of your active days.</span>
        <span className="ramp">Less {ramp.map(c => <span key={c} className="sw" style={{ background: c }} />)} More</span>
      </div>
    </>
  );
}

  ['what time is it', '', '', 'not_matched', {}],
  ['next song', 'media.next', 'press_keys', 'executed', {}],
  ['cancel', '', '', 'cancelled', {}],
  ['refresh', 'browser.refresh', 'press_keys', 'executed', {}]
];
const makeHistory = (count = 320) => {
  const rand = mulberry32(42);
  const rows = [];
  let t = new Date(2026, 9, 17, 14, 32).getTime();
  const fixed = [0, 1, 2, 3, 4, 5, 6, 7];
  for (let i = 0; i < count; i++) {
    const k = i < fixed.length ? fixed[i] : Math.floor(rand() * SAYINGS.length);
    const [heard, cmd, action, result, slots] = SAYINGS[k];
    const mode = rand() < 0.72 ? 'wake' : rand() < 0.8 ? 'push_to_talk' : 'continuous';
    const silence = mode === 'push_to_talk' ? 0 : 640 + Math.round(rand() * 110);
    const stt = 240 + Math.round(rand() * 230);
    const act = action ? 60 + Math.round(rand() * 150) : 0;
    const other = 40 + Math.round(rand() * 30);
    const sttConf = result === 'not_matched' ? 0.62 + rand() * 0.3 : 0.78 + rand() * 0.21;
    const matchConf = result === 'not_matched' ? 0.2 + rand() * 0.35 : result === 'low_confidence' ? 0.66 + rand() * 0.1 : heard.includes('spotfy') ? 0.84 : 0.88 + rand() * 0.12;
    rows.push({
      uuid: `c-${i}`, ts: new Date(t), heard, cmd, action, result, slots, mode,
      ms: { silence, stt, action: act, other, total: silence + stt + act + other },
      sttConf, matchConf, model: rand() < 0.85 ? 'base.en' : 'tiny.en',
      verdict: heard === 'open spotfy' ? 'wrong' : i % 9 === 3 ? 'right' : '',
      error: result === 'failed' ? 'App not found: "Figma" is not installed' : ''
    });
    t -= (2 + rand() * (i % 30 === 29 ? 600 : 18)) * 60000;
  }
  return rows;
};
const HISTORY = makeHistory();
