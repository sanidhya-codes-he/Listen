# continuous integration: lint and test on a fresh machine for every push and pull request
name: CI
on: [push, pull_request]

jobs:
  agent:
    runs-on: windows-latest          # the agent uses Windows-only libraries
    defaults:
      run:
        working-directory: agent     # every run: step starts inside agent/
    steps:
      - uses: actions/checkout@v4    # copy the repo onto the runner
      - uses: astral-sh/setup-uv@v10 # install uv; uv installs the Python from agent/.python-version
        with:
          version: "0.13.6"          # the same uv as on the laptop
          enable-cache: true         # reuse downloaded libraries between runs
          cache-dependency-glob: agent/uv.lock
      - run: uv sync --locked --extra dev   # exact versions from uv.lock; fails if the lock is stale
      - run: uv run ruff check .
      - run: uv run pytest           # speech tests (stage 2) skip: no clips on GitHub
